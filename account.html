<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>rorraxy - Retail Account & Order Tracking</title>

    <!-- সেন্ট্রাল স্ক্রিপ্ট ট্যাগ -->
    <script src="/ecosystem-core.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- পার্টিকেল ও অ্যানিমেশন লাইব্রেরি -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-body: #000000;
            --card-bg: #08080c;
            --border-color: rgba(212, 175, 55, 0.35);
            --gold-color: #d4af37;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --text-main: #ffffff;
            --text-muted: #a0a0b8;
            --font-family: 'Plus Jakarta Sans', sans-serif;
            --accent-green: #00e676;
            --danger-red: #ff3b30;
        }

        * {
            box-sizing: border-box !important;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-family);
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 16px 16px 90px 16px;
            text-transform: uppercase !important;
            -webkit-font-smoothing: antialiased;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 99999;
        }

        .account-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            animation: luxurySlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            margin-top: 10px;
        }

        @keyframes luxurySlideUp {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Search Header Bar */
        .search-tracking-box {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
        }

        .search-input-field {
            flex: 1;
            background: #040407;
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 12px;
            padding: 10px 14px;
            color: #fff;
            font-size: 0.78rem;
            outline: none;
            font-family: var(--font-family);
        }
        .search-input-field:focus { border-color: var(--gold-color); }

        .search-submit-btn {
            background: var(--gold-gradient);
            border: none;
            color: #000;
            font-weight: 900;
            font-size: 0.75rem;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            white-space: nowrap;
        }

        .empty-orders-screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 20px;
            gap: 24px;
        }

        .top-brand-logo {
            width: 140px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.6));
        }

        .mode-status-badge {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--gold-color);
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .shop-now-btn {
            background: var(--gold-gradient);
            color: #000;
            font-weight: 900;
            font-size: 0.85rem;
            padding: 12px 35px;
            border-radius: 30px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.4);
            border: none;
            cursor: pointer;
        }

        .order-summary-banner {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(212,175,55,0.2);
            width: 100%;
        }

        .order-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .order-meta .main-id {
            font-size: 0.90rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .download-memo-btn {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
        }

        .section-title {
            font-size: 0.80rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.8px;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .product-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .product-card-top {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .product-img {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            object-fit: cover;
            background: #040407;
            border: 1px solid rgba(212,175,55,0.15);
        }

        .product-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .product-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.3;
        }

        .product-specs {
            font-size: 0.65rem;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
            font-weight: 600;
        }

        .product-price {
            font-size: 0.90rem;
            font-weight: 900;
            color: var(--gold-color);
        }

        .seller-info-strip {
            background: #040407;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.68rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .card-details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            background: #040407;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .detail-item label {
            font-size: 0.58rem;
            color: var(--text-muted);
            font-weight: 700;
        }

        .detail-item span {
            font-size: 0.72rem;
            font-weight: 800;
            color: #fff;
        }

        /* MEMO MODAL */
        .memo-modal-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            z-index: 99999;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .memo-modal-card {
            background: #08080c;
            color: #ffffff;
            width: 100%;
            max-width: 520px;
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.3);
            max-height: 90vh;
            overflow-y: auto;
        }
        .memo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
        }
        .memo-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }
        .memo-table th, .memo-table td {
            padding: 10px 4px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .memo-table th { color: var(--gold-color); font-weight: 800; }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div class="account-container">
        
        <!-- SEARCH TRACKING BAR -->
        <div class="search-tracking-box">
            <input type="text" id="orderSearchInput" class="search-input-field" placeholder="ENTER MASTER ID, SUB ORDER OR TRACKING #">
            <button onclick="executeOrderSearch()" class="search-submit-btn"><i class="fa-solid fa-magnifying-glass"></i> TRACK</button>
        </div>

        <div id="accountDynamicContent" style="width: 100%; display: flex; flex-direction: column; gap: 16px;">
            <!-- Dynamic Content Loaded Here -->
        </div>

    </div>

    <!-- VIP MEMO MODAL -->
    <div class="memo-modal-backdrop" id="memoModal">
        <div class="memo-modal-card" onclick="event.stopPropagation();">
            <div class="memo-header">
                <div>
                    <h2 style="font-size:1.1rem; font-weight:900; background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">RORRAXY RETAIL</h2>
                    <p style="font-size:0.60rem; color:var(--text-muted);">VIP DIGITAL ORDER MEMO & VOUCHER</p>
                </div>
                <div style="text-align:right;">
                    <p style="font-size:0.75rem; font-weight:900; color:#fff;" id="memoInvoiceId">#RRX-000000</p>
                    <p style="font-size:0.60rem; color:var(--text-muted);" id="memoDate">2026</p>
                </div>
            </div>

            <div style="font-size:0.72rem; color:var(--text-muted); line-height:1.5;">
                <strong>CUSTOMER NAME:</strong> <span id="memoCustomerName" style="color:#fff;">--</span><br>
                <strong>PHONE NUMBER:</strong> <span id="memoCustomerPhone" style="color:#fff;">--</span><br>
                <strong>PAYMENT METHOD:</strong> <span id="memoPaymentMethod" style="color:#fff;">Online Gateway</span><br>
                <strong>STATUS:</strong> <span id="memoStatus" style="color:var(--accent-green); font-weight:bold;">CONFIRMED</span>
            </div>

            <table class="memo-table">
                <thead>
                    <tr>
                        <th>PRODUCT</th>
                        <th>QTY</th>
                        <th>PRICE</th>
                    </tr>
                </thead>
                <tbody id="memoItemsTable"></tbody>
            </table>

            <div style="display:flex; justify-content:space-between; font-weight:900; font-size:0.90rem; border-top:1px solid rgba(255,255,255,0.08); padding-top:8px; color:var(--gold-color);">
                <span>TOTAL PAYABLE:</span>
                <span id="memoTotalDisplay">$0.00</span>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:8px;">
                <button onclick="closeMemoModal()" style="background:#222; color:#fff; border:none; padding:8px 16px; border-radius:20px; font-weight:800; cursor:pointer; font-size:0.72rem;">CLOSE</button>
            </div>
        </div>
    </div>

    <script>
        // ডাইরেক্ট ক্লাউডফেয়ার পেজ ফাংশন রুট এন্ডপয়েন্ট (Workers লিংক ছাড়াই ডিরেক্ট কানেকশন)
        const API_BASE_URL = ''; 
        let currentOrderData = null;

        window.onload = function() {
            initRetailAccountFetch();
        };

        async function initRetailAccountFetch() {
            const lastOrderRaw = localStorage.getItem('rorraxy_last_order');
            if (lastOrderRaw) {
                try {
                    currentOrderData = JSON.parse(lastOrderRaw);
                    renderOrdersUI(currentOrderData);
                    return;
                } catch(e) { console.error(e); }
            }

            try {
                let response = await fetch(`${API_BASE_URL}/api/get?table=retail_orders&limit=1`);
                let result = await response.json();

                if (result.success && Array.isArray(result.data) && result.data.length > 0) {
                    currentOrderData = result.data[0];
                    renderOrdersUI(currentOrderData);
                } else {
                    renderEmptyOrdersUI();
                }
            } catch(err) {
                console.warn("Cloudflare D1 Order Fetch Error:", err);
                renderEmptyOrdersUI();
            }
        }

        async function executeOrderSearch() {
            let query = document.getElementById('orderSearchInput').value.trim();
            if(!query) {
                initRetailAccountFetch();
                return;
            }

            try {
                let response = await fetch(`${API_BASE_URL}/api/get?table=retail_orders`);
                let result = await response.json();

                if (result.success && Array.isArray(result.data)) {
                    let found = result.data.find(o => 
                        (o.master_order_id && o.master_order_id.toLowerCase().includes(query.toLowerCase())) ||
                        (o.id && String(o.id).includes(query))
                    );

                    if (found) {
                        currentOrderData = found;
                        renderOrdersUI(currentOrderData);
                    } else {
                        alert("No order found matching your query ID!");
                    }
                }
            } catch(e) {
                console.error("Search error:", e);
                alert("Error searching orders from database.");
            }
        }

        function renderEmptyOrdersUI() {
            const container = document.getElementById('accountDynamicContent');
            container.innerHTML = `
                <div class="empty-orders-screen">
                    <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" class="top-brand-logo" alt="rorraxy Logo">
                    <div class="mode-status-badge">
                        <i class="fa-solid fa-circle-check"></i> ACTIVE CHANNEL: RETAIL ACCOUNT
                    </div>
                    <p style="font-size:0.75rem; color:var(--text-muted);">NO ACTIVE ORDERS FOUND</p>
                    <button onclick="window.location.href='/index.html'" class="shop-now-btn">
                        <i class="fa-solid fa-bag-shopping"></i> START SHOPPING
                    </button>
                </div>
            `;
        }

        function renderOrdersUI(orderData) {
            const container = document.getElementById('accountDynamicContent');
            const items = orderData.items || [];
            const mainOrderId = orderData.master_order_id || orderData.id || 'RRX-RET-' + Math.floor(100000 + Math.random() * 900000);
            
            let html = `
                <div class="order-summary-banner">
                    <div class="order-meta">
                        <span class="main-id"><i class="fa-solid fa-box" style="color:var(--gold-color);"></i> RETAIL ORDER ID: ${mainOrderId}</span>
                        <span style="font-size:0.68rem; color:var(--text-muted);"><i class="fa-regular fa-clock"></i> ${orderData.payment_method || 'Online Payment'}</span>
                    </div>
                    <button onclick="openMemoModal();" class="download-memo-btn">
                        <i class="fa-solid fa-file-arrow-down"></i> VIEW VOUCHER / MEMO
                    </button>
                </div>

                <div class="section-title">
                    <i class="fa-solid fa-truck-fast"></i> ORDER ITEM TRACKING (${items.length})
                </div>

                <div class="product-grid">
            `;

            items.forEach((item, index) => {
                const itemOrderId = item.orderId || `${mainOrderId}-${index + 1}`;
                const title = item.title || item.product_title || 'Retail Product';
                const price = item.price ? (typeof item.price === 'number' ? `$${item.price.toFixed(2)}` : item.price) : '$0.00';
                const qty = item.qty || 1;
                const image = item.img || item.image_url || 'https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png';

                html += `
                    <div class="product-card">
                        <div class="product-card-top">
                            <img src="${image}" class="product-img" alt="${title}">
                            <div class="product-info">
                                <span class="product-title">${title}</span>
                                <div class="product-specs">
                                    <span>QTY: ${qty}</span>
                                </div>
                                <span class="product-price">${price}</span>
                            </div>
                        </div>
                        <div class="card-details-grid">
                            <div class="detail-item">
                                <label>ITEM ORDER ID</label>
                                <span>${itemOrderId}</span>
                            </div>
                            <div class="detail-item">
                                <label>STATUS</label>
                                <span style="color:var(--accent-green);"><i class="fa-solid fa-circle-dot"></i> FULFILLED</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function openMemoModal() {
            if(!currentOrderData) return;
            document.getElementById('memoInvoiceId').innerText = `#${currentOrderData.master_order_id || currentOrderData.id || 'RRX-000000'}`;
            document.getElementById('memoCustomerName').innerText = currentOrderData.customer_name || 'Valued Customer';
            document.getElementById('memoCustomerPhone').innerText = currentOrderData.customer_phone || 'N/A';

            let totalAmt = 0;
            let tbodyHtml = '';
            (currentOrderData.items || []).forEach(item => {
                let itemPriceNum = parseFloat(String(item.price).replace('$', '')) || 0;
                let itemTotal = itemPriceNum * (item.qty || 1);
                totalAmt += itemTotal;
                tbodyHtml += `
                    <tr>
                        <td>${item.title || item.product_title || 'Retail Product'}</td>
                        <td>${item.qty || 1}</td>
                        <td style="color:var(--gold-color); font-weight:800;">$${itemPriceNum.toFixed(2)}</td>
                    </tr>
                `;
            });
            document.getElementById('memoItemsTable').innerHTML = tbodyHtml;
            document.getElementById('memoTotalDisplay').innerText = `$${currentOrderData.total_amount || totalAmt.toFixed(2)} USD`;
            document.getElementById('memoModal').style.display = 'flex';
        }

        function closeMemoModal() {
            document.getElementById('memoModal').style.display = 'none';
        }
    </script>
</body>
</html>
