<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>rorraxy - Retail Account & Order Tracking</title>

    <script src="/ecosystem-core.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- পার্টিকেল ও পিডিএফ ডাউনলোডার লাইব্রেরি (html2pdf.js) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg-body: #000000;
            --card-bg: #08080c;
            --border-color: rgba(212, 175, 55, 0.35);
            --gold-color: #d4af37;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --text-main: #ffffff;
            --text-muted: #a0a0b8;
            --font-family: 'Plus Jakarta Sans', sans-serif;
            --accent-green: #00e676;
            --danger-red: #ff3b30;
        }

        * {
            box-sizing: border-box !important;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-family);
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 16px 16px 90px 16px;
            text-transform: uppercase !important;
            -webkit-font-smoothing: antialiased;
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 99999;
        }

        .account-container {
            width: 100%;
            max-width: 750px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            animation: luxurySlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            margin-top: 10px;
        }

        @keyframes luxurySlideUp {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Search Header Bar */
        .search-tracking-box {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
        }

        .search-input-field {
            flex: 1;
            background: #040407;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 10px 14px;
            color: #fff;
            font-size: 0.78rem;
            outline: none;
            font-family: var(--font-family);
        }
        .search-input-field:focus { border-color: var(--gold-color); }

        .search-submit-btn {
            background: var(--gold-gradient);
            border: none;
            color: #000;
            font-weight: 900;
            font-size: 0.75rem;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            white-space: nowrap;
        }

        .empty-orders-screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 20px;
            gap: 24px;
        }

        .top-brand-logo {
            width: 120px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.5));
        }

        .mode-status-badge {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--gold-color);
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .shop-now-btn {
            background: var(--gold-gradient);
            color: #000;
            font-weight: 900;
            font-size: 0.85rem;
            padding: 12px 35px;
            border-radius: 30px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.4);
            border: none;
            cursor: pointer;
        }

        /* UNIFIED MEMO & PREVIEW CARD */
        .memo-preview-card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 20px;
            padding: 22px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.9);
        }

        .memo-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 14px;
        }

        .download-pdf-btn {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 11px 20px;
            border-radius: 25px;
            font-size: 0.75rem;
            font-weight: 900;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
            transition: transform 0.1s;
        }
        .download-pdf-btn:active { transform: scale(0.96); }

        .memo-details-grid {
            background: #040407;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.72rem;
            color: var(--text-muted);
            line-height: 1.6;
        }
        .memo-details-grid span { color: #fff; font-weight: 700; }

        /* ITEMS TABLE */
        .memo-items-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.72rem;
            margin-top: 4px;
        }
        .memo-items-table th, .memo-items-table td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .memo-items-table th {
            color: var(--gold-color);
            font-weight: 800;
            font-size: 0.68rem;
        }
        .table-item-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .table-thumb {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid rgba(212,175,55,0.2);
            background: #000;
        }

        .memo-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.92rem;
            font-weight: 900;
            color: var(--gold-color);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            padding-top: 12px;
            margin-top: 4px;
        }

        .section-title {
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--gold-color);
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div class="account-container">
        
        <!-- SEARCH TRACKING BAR -->
        <div class="search-tracking-box">
            <input type="text" id="orderSearchInput" class="search-input-field" placeholder="ENTER MASTER ORDER ID OR PHONE NUMBER">
            <button onclick="executeOrderSearch()" class="search-submit-btn"><i class="fa-solid fa-magnifying-glass"></i> TRACK</button>
        </div>

        <div id="accountDynamicContent" style="width: 100%; display: flex; flex-direction: column; gap: 16px;">
            <!-- Dynamic Content Loaded Here -->
        </div>

    </div>

    <script>
        const API_BASE_URL = ''; 
        let currentOrderData = null;

        window.onload = function() {
            initRetailAccountFetch();
            triggerConfetti();
        };

        function triggerConfetti() {
            try {
                confetti({
                    particleCount: 75,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#d4af37', '#fcf6ba', '#b38728', '#ffffff']
                });
            } catch(e) {}
        }

        async function initRetailAccountFetch() {
            const lastOrderRaw = localStorage.getItem('rorraxy_last_order');
            if (lastOrderRaw) {
                try {
                    currentOrderData = JSON.parse(lastOrderRaw);
                    renderOrdersUI(currentOrderData);
                    return;
                } catch(e) { console.error(e); }
            }

            try {
                let response = await fetch(`${API_BASE_URL}/api/get?table=retail_orders&limit=1`);
                let result = await response.json();

                if (result.success && Array.isArray(result.data) && result.data.length > 0) {
                    currentOrderData = result.data[0];
                    renderOrdersUI(currentOrderData);
                } else {
                    renderEmptyOrdersUI();
                }
            } catch(err) {
                console.warn("Cloudflare D1 Order Fetch Error:", err);
                renderEmptyOrdersUI();
            }
        }

        async function executeOrderSearch() {
            let query = document.getElementById('orderSearchInput').value.trim();
            if(!query) {
                initRetailAccountFetch();
                return;
            }

            try {
                let response = await fetch(`${API_BASE_URL}/api/get?table=retail_orders`);
                let result = await response.json();

                if (result.success && Array.isArray(result.data)) {
                    let found = result.data.find(o => 
                        (o.master_order_id && o.master_order_id.toLowerCase().includes(query.toLowerCase())) ||
                        (o.customer_phone && o.customer_phone.includes(query)) ||
                        (o.id && String(o.id).includes(query))
                    );

                    if (found) {
                        currentOrderData = found;
                        renderOrdersUI(currentOrderData);
                    } else {
                        alert("No order found matching your search query!");
                    }
                }
            } catch(e) {
                console.error("Search error:", e);
                alert("Error searching database.");
            }
        }

        function renderEmptyOrdersUI() {
            const container = document.getElementById('accountDynamicContent');
            container.innerHTML = `
                <div class="empty-orders-screen">
                    <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" class="top-brand-logo" alt="rorraxy Logo">
                    <div class="mode-status-badge">
                        <i class="fa-solid fa-circle-check"></i> ACTIVE CHANNEL: RETAIL ACCOUNT
                    </div>
                    <p style="font-size:0.75rem; color:var(--text-muted);">NO ACTIVE ORDERS FOUND</p>
                    <button onclick="window.location.href='/index.html'" class="shop-now-btn">
                        <i class="fa-solid fa-bag-shopping"></i> START SHOPPING
                    </button>
                </div>
            `;
        }

        function renderOrdersUI(orderData) {
            const container = document.getElementById('accountDynamicContent');
            const items = orderData.items || [];
            const mainOrderId = orderData.master_order_id || orderData.id || 'RRX-RET-' + Math.floor(100000 + Math.random() * 900000);
            const customerName = orderData.customer_name || 'Valued Customer';
            const customerPhone = orderData.customer_phone || 'N/A';
            const paymentMethod = orderData.payment_method || 'Online Gateway';
            const orderDate = orderData.created_at ? new Date(orderData.created_at).toLocaleDateString() : '2026';

            let itemsTableHtml = '';
            let totalAmt = 0;

            items.forEach((item) => {
                let itemPriceNum = parseFloat(String(item.price || '0').replace('$', '')) || 0;
                let itemTotal = itemPriceNum * (item.qty || 1);
                totalAmt += itemTotal;
                let imgUrl = item.img || item.image_url || 'https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png';
                let title = item.title || item.product_title || 'Retail Product';

                itemsTableHtml += `
                    <tr>
                        <td>
                            <div class="table-item-row">
                                <img src="${imgUrl}" class="table-thumb" alt="Product">
                                <span>${title}</span>
                            </div>
                        </td>
                        <td style="text-align:center;">${item.qty || 1}</td>
                        <td style="text-align:right; color:var(--gold-color); font-weight:800;">$${itemTotal.toFixed(2)}</td>
                    </tr>
                `;
            });

            let finalTotal = orderData.total_amount ? parseFloat(orderData.total_amount).toFixed(2) : totalAmt.toFixed(2);

            container.innerHTML = `
                <div class="section-title">
                    <i class="fa-solid fa-file-invoice"></i> ORDER PREVIEW & OFFICIAL VOUCHER MEMO
                </div>

                <!-- এই অংশটি এক ক্লিকে সরাসরি পিডিএফ (PDF) আকারে ডাউনলোড হবে -->
                <div class="memo-preview-card" id="printableMemoArea">
                    <div class="memo-top-row">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" style="width:48px; height:auto;" alt="Logo">
                            <div>
                                <h2 style="font-size:0.95rem; font-weight:900; background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">RORRAXY RETAIL</h2>
                                <p style="font-size:0.55rem; color:var(--text-muted);">OFFICIAL DIGITAL MEMO & FULFILLMENT</p>
                            </div>
                        </div>
                        <div style="text-align:right;">
                            <p style="font-size:0.75rem; font-weight:900; color:#fff;">#${mainOrderId}</p>
                            <p style="font-size:0.55rem; color:var(--text-muted);">${orderDate}</p>
                        </div>
                    </div>

                    <div class="memo-details-grid">
                        <strong>CUSTOMER NAME:</strong> <span>${customerName}</span><br>
                        <strong>PHONE / WHATSAPP:</strong> <span>${customerPhone}</span><br>
                        <strong>PAYMENT METHOD:</strong> <span>${paymentMethod}</span><br>
                        <strong>ORDER STATUS:</strong> <span style="color:var(--accent-green);">CONFIRMED & FULFILLED</span>
                    </div>

                    <table class="memo-items-table">
                        <thead>
                            <tr>
                                <th>PRODUCT ITEM</th>
                                <th style="text-align:center;">QTY</th>
                                <th style="text-align:right;">AMOUNT</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsTableHtml}
                        </tbody>
                    </table>

                    <div class="memo-total-row">
                        <span>TOTAL PAYABLE:</span>
                        <span>$${finalTotal} USD</span>
                    </div>
                </div>

                <!-- ডাউনলোড পিডিএফ বাটন -->
                <div style="display:flex; justify-content:flex-end; width:100%;">
                    <button onclick="downloadMemoAsPDF('${mainOrderId}')" class="download-pdf-btn">
                        <i class="fa-solid fa-file-arrow-down"></i> DOWNLOAD MEMO PDF
                    </button>
                </div>
            `;
        }

        function downloadMemoAsPDF(orderId) {
            const element = document.getElementById('printableMemoArea');
            const options = {
                margin:       10,
                filename:     `rorraxy-memo-${orderId}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().from(element).set(options).save();
        }
    </script>
</body>
</html>
