<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Seller Payout - rorraxy Ecosystem</title>
    
    <script src="/ecosystem-core.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #08080c;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #a0a0ab;
            --font-main: 'Poppins', sans-serif;
            --required-red: #ff4d4d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; overflow-x: hidden; background: var(--bg-retail) !important; color: var(--text-white); font-family: var(--font-main); min-height: 100vh; font-size: 14px; }
        body { padding: 24px 16px 90px 16px; text-transform: uppercase; }

        .main-container { width: 100%; max-width: 900px; margin: 0 auto; }
        .dashboard-header { text-align: center; margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .header-logo-img { width: 90px; height: 90px; object-fit: contain; filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.6)); }
        .dashboard-header h1 { font-size: 1.5rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .balance-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 25px; }
        .balance-card { background: var(--card-retail); border-radius: 18px; padding: 20px 16px; text-align: center; display: flex; flex-direction: column; gap: 8px; border: 1px solid rgba(212, 175, 55, 0.15); }
        .balance-card h3 { font-size: 0.68rem; color: var(--text-gray); font-weight: 700; }
        .balance-card .amount { font-size: 1.25rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .payout-card, .history-card { background: var(--card-retail); border-radius: 18px; padding: 24px 20px; margin-bottom: 25px; border: 1px solid rgba(212, 175, 55, 0.15); }
        .section-title { font-size: 0.85rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(212, 175, 55, 0.15); padding-bottom: 8px; }

        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full-width { grid-column: span 2; }
        .form-group label { font-size: 0.72rem; font-weight: 700; color: var(--text-gray); }
        .req-star { color: var(--required-red); margin-left: 3px; }

        .form-control, .form-select { width: 100%; background: #040407; border: none; border-radius: 12px; padding: 12px 16px; color: var(--text-white); font-size: 0.8rem; outline: none; font-family: var(--font-main); text-transform: none; }
        .form-select option { background: #08080c; color: #fff; }

        .withdraw-btn { width: 100%; background: var(--gold-gradient); border: none; border-radius: 14px; padding: 14px; color: #000; font-weight: 800; font-size: 0.85rem; cursor: pointer; text-transform: uppercase; }

        .table-responsive { width: 100%; overflow-x: auto; }
        .payout-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.75rem; white-space: nowrap; }
        .payout-table th { color: var(--gold-solid); padding: 12px 14px; background: #040407; }
        .payout-table td { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.03); text-transform: none; }

        .status-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 700; }
        .status-badge.paid { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .status-badge.pending { background: rgba(234, 179, 8, 0.15); color: #facc15; }

        .seller-bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(3, 3, 5, 0.95); border-top: 1px solid rgba(212, 175, 55, 0.15); display: flex; justify-content: space-around; align-items: center; padding: 12px 6px; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; flex: 1; background: none; border: none; cursor: pointer; }
        .nav-item.active i, .nav-item.active span { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-item i { font-size: 1.25rem; margin-bottom: 4px; color: var(--text-gray); }
        .nav-item span { font-size: 0.62rem; font-weight: 700; color: var(--text-gray); }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="dashboard-header">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="Logo" class="header-logo-img">
            <h1>SELLER PAYOUT</h1>
        </header>

        <section class="balance-grid">
            <div class="balance-card"><h3>TOTAL EARNINGS</h3><div class="amount" id="totalEarn">$0.00</div></div>
            <div class="balance-card"><h3>AVAILABLE BALANCE</h3><div class="amount" id="availBal">$0.00</div></div>
            <div class="balance-card"><h3>PENDING CLEARANCE</h3><div class="amount" id="pendBal">$0.00</div></div>
        </section>

        <section class="payout-card">
            <form id="payoutForm">
                <div class="section-title"><i class="fa-solid fa-hand-holding-dollar"></i><span>REQUEST WITHDRAWAL</span></div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>WITHDRAW AMOUNT ($)<span class="req-star">*</span></label>
                        <input type="number" class="form-control" id="withdrawAmount" placeholder="Min $10..." min="10" required>
                    </div>
                    <div class="form-group">
                        <label>PAYOUT METHOD<span class="req-star">*</span></label>
                        <select class="form-select" id="payoutMethod" required>
                            <option value="bKash">bKash</option>
                            <option value="Nagad">Nagad</option>
                            <option value="Bank">Bank Transfer</option>
                            <option value="Payoneer">Payoneer (International)</option>
                        </select>
                    </div>
                    <div class="form-grid full-width" id="payoutDetailsGrid" style="margin-bottom: 0;">
                        <div class="form-group full-width">
                            <label>BKASH PERSONAL NUMBER<span class="req-star">*</span></label>
                            <input type="text" class="form-control" id="bkashAccInput" placeholder="Enter 11-digit bKash number..." required>
                        </div>
                    </div>
                </div>
                <button type="submit" class="withdraw-btn">SUBMIT PAYOUT REQUEST</button>
            </form>
        </section>

        <section class="history-card">
            <div class="section-title"><i class="fa-solid fa-clock-rotate-left"></i><span>PAYOUT HISTORY</span></div>
            <div class="table-responsive">
                <table class="payout-table">
                    <thead>
                        <tr><th>DATE</th><th>METHOD</th><th>ACCOUNT / DETAILS</th><th>AMOUNT</th><th>STATUS</th></tr>
                    </thead>
                    <tbody id="payoutHistoryBody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <nav class="seller-bottom-nav">
        <a href="list.html" class="nav-item"><i class="fa-solid fa-list-check"></i><span>LIST</span></a>
        <a href="payout.html" class="nav-item active"><i class="fa-solid fa-hand-holding-dollar"></i><span>PAYOUT</span></a>
        <button type="button" class="nav-item" onclick="location.href='dashboard.html'"><i class="fa-solid fa-house"></i><span>HOME</span></button>
        <a href="shipment.html" class="nav-item"><i class="fa-solid fa-truck-fast"></i><span>SHIPMENT</span></a>
        <a href="info.html" class="nav-item"><i class="fa-solid fa-user"></i><span>INFO</span></a>
    </nav>

    <script>
        window.onload = function() {
            loadPayoutRealtimeData();
            setInterval(loadPayoutRealtimeData, 2000);
        };

        function loadPayoutRealtimeData() {
            try {
                let sellerNotifs = JSON.parse(localStorage.getItem('rorraxy_seller_notifications') || '[]');
                let totalEarned = 0, pendingClearance = 0;

                sellerNotifs.forEach(item => {
                    let priceNum = parseFloat(String(item.price || '10').replace('$', '')) * (item.qty || 1);
                    if (item.status && (item.status.includes('Delivered') || item.status.includes('completed'))) {
                        totalEarned += priceNum;
                    } else {
                        pendingClearance += priceNum;
                    }
                });

                let netEarned = totalEarned * 0.90;
                let availBalance = netEarned; 
                let payoutRequests = JSON.parse(localStorage.getItem('rorraxy_seller_payouts') || '[]');
                
                payoutRequests.forEach(req => {
                    if (req.status === 'PAID' || req.status === 'PENDING') availBalance -= req.amount;
                });

                if (availBalance < 0) availBalance = 0;

                document.getElementById('totalEarn').innerText = `$${netEarned.toFixed(2)}`;
                document.getElementById('availBal').innerText = `$${availBalance.toFixed(2)}`;
                document.getElementById('pendBal').innerText = `$${(pendingClearance * 0.90).toFixed(2)}`;

                renderPayoutHistory(payoutRequests);
            } catch(e) { console.error(e); }
        }

        function renderPayoutHistory(payoutRequests) {
            const tbody = document.getElementById('payoutHistoryBody');
            let html = '';
            if (payoutRequests.length === 0) {
                html = `<tr><td colspan="5" style="text-align:center; color:var(--text-gray); padding:16px;">NO PAYOUT HISTORY FOUND.</td></tr>`;
            } else {
                payoutRequests.forEach(req => {
                    let badgeClass = req.status === 'PAID' ? 'paid' : 'pending';
                    html += `<tr><td>${req.date}</td><td>${req.method}</td><td>${req.details}</td><td>$${req.amount.toFixed(2)}</td><td><span class="status-badge ${badgeClass}">${req.status}</span></td></tr>`;
                });
            }
            tbody.innerHTML = html;
        }

        const payoutMethod = document.getElementById('payoutMethod');
        const payoutDetailsGrid = document.getElementById('payoutDetailsGrid');

        payoutMethod.addEventListener('change', () => {
            const val = payoutMethod.value;
            if (val === 'bKash') {
                payoutDetailsGrid.innerHTML = `<div class="form-group full-width"><label>BKASH NUMBER<span class="req-star">*</span></label><input type="text" class="form-control" id="bkashAccInput" placeholder="Enter bKash number..." required></div>`;
            } else if (val === 'Nagad') {
                payoutDetailsGrid.innerHTML = `<div class="form-group full-width"><label>NAGAD NUMBER<span class="req-star">*</span></label><input type="text" class="form-control" id="nagadAccInput" placeholder="Enter Nagad number..." required></div>`;
            } else if (val === 'Bank') {
                payoutDetailsGrid.innerHTML = `<div class="form-group"><label>BANK NAME<span class="req-star">*</span></label><input type="text" class="form-control" id="bankNameInput" placeholder="Bank name..." required></div><div class="form-group"><label>ACC NUMBER<span class="req-star">*</span></label><input type="text" class="form-control" id="accNumberInput" placeholder="Account number..." required></div>`;
            } else if (val === 'Payoneer') {
                payoutDetailsGrid.innerHTML = `<div class="form-group full-width"><label>PAYONEER EMAIL<span class="req-star">*</span></label><input type="email" class="form-control" id="payoneerEmailInput" placeholder="Payoneer email..." required></div>`;
            }
        });

        document.getElementById('payoutForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const method = payoutMethod.value;
            let detailText = method === 'bKash' ? document.getElementById('bkashAccInput').value : (method === 'Nagad' ? document.getElementById('nagadAccInput').value : 'Bank/Payoneer');
            let currentAvail = parseFloat(document.getElementById('availBal').innerText.replace('$', ''));

            if (amount < 10) { alert('MINIMUM WITHDRAWAL IS $10!'); return; }
            if (amount > currentAvail) { alert('INSUFFICIENT BALANCE!'); return; }

            const today = new Date().toLocaleDateString();
            let newRequest = { date: today, method: method, details: detailText, amount: amount, status: 'PENDING' };
            let payoutRequests = JSON.parse(localStorage.getItem('rorraxy_seller_payouts') || '[]');
            
            payoutRequests.unshift(newRequest);
            localStorage.setItem('rorraxy_seller_payouts', JSON.stringify(payoutRequests));

            loadPayoutRealtimeData();
            alert('PAYOUT REQUEST SUBMITTED SUCCESSFULLY!');
            e.target.reset();
        });
    </script>
</body>
</html>
