<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Seller Dashboard - rorraxy Ecosystem</title>
   
    <!-- সেন্ট্রাল স্ক্রিপ্ট ট্যাগ -->
    <script src="/ecosystem-core.js"></script>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #08080c;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #a0a0ab;
            --font-main: 'Poppins', sans-serif;
            --border-color: rgba(212, 175, 55, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; overflow-x: hidden; background: var(--bg-retail) !important; color: var(--text-white); font-family: var(--font-main); min-height: 100vh; font-size: 14px; -webkit-font-smoothing: antialiased; }
        body { padding: 24px 16px 110px 16px; text-transform: uppercase; }
        
        .main-container { 
            width: 100%; 
            max-width: 1200px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* Header Section (শ্যাডো মুক্ত পরিচ্ছন্ন লাক্সারি লেআউট) */
        .dashboard-header { text-align: center; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
        .header-logo-img { width: 90px; height: 90px; object-fit: contain; background: transparent !important; mix-blend-mode: screen; filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.5)); }
        .dashboard-header h1 { font-size: 1.75rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.8px; }

        .header-email-box { display: inline-flex; align-items: center; gap: 8px; background: var(--card-retail); padding: 8px 18px; border-radius: 25px; text-decoration: none; font-size: 0.78rem; color: var(--text-gray); border: 1px solid var(--border-color); text-transform: lowercase; }
        .header-email-box i { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-email-box span { color: var(--text-white); font-weight: 600; }

        /* Stats Grid Section (কম্পিউটার ও মোবাইলে সুন্দর ফিটিং) */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 16px; 
            margin-bottom: 30px; 
            width: 100%; 
        }

        .stat-card { 
            background: var(--card-retail); 
            border-radius: 16px; 
            padding: 20px 14px 14px 14px; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            gap: 8px; 
            border: 1px solid var(--border-color); 
            width: 100%;
            min-width: 0;
        }

        .stat-card h3 { font-size: 0.72rem; color: var(--text-gray); font-weight: 600; letter-spacing: 0.5px; white-space: nowrap; }
        .stat-card .value { font-size: 1.35rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .graph-container { width: 100%; height: 60px; margin-top: 6px; position: relative; }

        /* Bottom Fixed Navigation Menu (৫টি মেনু) */
        .seller-bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(3, 3, 5, 0.95); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; padding: 12px 6px; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; flex: 1; background: none; border: none; cursor: pointer; }
        .nav-item.active i, .nav-item.active span { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-item i { font-size: 1.25rem; margin-bottom: 4px; color: var(--text-gray); }
        .nav-item span { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.5px; color: var(--text-gray); }

        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
        }

        @media (max-width: 600px) {
            body { padding: 16px 12px 100px 12px; }
            .stats-grid { grid-template-columns: 1fr; gap: 12px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- Header -->
        <header class="dashboard-header">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="rorraxy Logo" class="header-logo-img">
            <h1>SELLER DASHBOARD</h1>
            <a href="mailto:seller@rorraxy.com?subject=Seller%20Support%20Query" class="header-email-box">
                <i class="fa-solid fa-envelope"></i>
                <span>seller@rorraxy.com</span>
            </a>
        </header>

        <!-- Stats Overview -->
        <section class="stats-grid">
            <div class="stat-card">
                <h3>TOTAL REVENUE</h3>
                <div class="value" id="statRevenueVal">$0.00</div>
                <div class="graph-container"><canvas id="chartRevenue"></canvas></div>
            </div>
            <div class="stat-card">
                <h3>TOTAL BALANCE</h3>
                <div class="value" id="statBalanceVal">$0.00</div>
                <div class="graph-container"><canvas id="chartBalance"></canvas></div>
            </div>
            <div class="stat-card">
                <h3>TOTAL PRODUCT</h3>
                <div class="value" id="statProductsVal">0</div>
                <div class="graph-container"><canvas id="chartProducts"></canvas></div>
            </div>
            <div class="stat-card">
                <h3>TOTAL ORDER</h3>
                <div class="value" id="statOrdersVal">0</div>
                <div class="graph-container"><canvas id="chartOrders"></canvas></div>
            </div>
        </section>

    </div>

    <!-- Seller Bottom Navigation Menu -->
    <nav class="seller-bottom-nav">
        <a href="list.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>LIST</span>
        </a>
        <a href="payout.html" class="nav-item" onclick="checkPayoutAccess(event)">
            <i class="fa-solid fa-hand-holding-dollar"></i>
            <span>PAYOUT</span>
        </a>
        <a href="upload.html" class="nav-item">
            <i class="fa-solid fa-plus"></i>
            <span>UPLOAD</span>
        </a>
        <a href="shipment.html" class="nav-item">
            <i class="fa-solid fa-truck-fast"></i>
            <span>SHIPMENT</span>
        </a>
        <a href="info.html" class="nav-item">
            <i class="fa-solid fa-user-gear"></i>
            <span>INFO</span>
        </a>
    </nav>

    <!-- Cloudflare Pages Functions API Real-time Integration -->
    <script>
        // পে-আউটে যাওয়ার আগে সেটিংস ও বায়োমেট্রিক ভেরিফিকেশন চেক গেটওয়ে
        function checkPayoutAccess(e) {
            const savedProfile = JSON.parse(localStorage.getItem('rorraxy_seller_profile') || 'null');
            const isBiometricVerified = localStorage.getItem('rorraxy_biometric_verified');

            if (!savedProfile || !savedProfile.brandName || isBiometricVerified !== 'true') {
                e.preventDefault();
                alert('MANDATORY: PLEASE COMPLETE YOUR BUSINESS INFO & BIOMETRIC VERIFICATION IN SETTINGS (INFO) BEFORE ACCESSING PAYOUT!');
                window.location.href = 'info.html';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadPureCloudDashboardStats();
            setInterval(loadPureCloudDashboardStats, 3000);
        });

        async function loadPureCloudDashboardStats() {
            try {
                // ১. ক্লাউড D1 থেকে প্রোডাক্ট ডেটা ফেচ করা
                const prodResponse = await fetch(`/api/get?table=products`);
                const prodResult = await prodResponse.json();
                
                let productCount = 0;
                if (prodResult.success && Array.isArray(prodResult.data)) {
                    productCount = prodResult.data.length;
                } else if (Array.isArray(prodResult)) {
                    productCount = prodResult.length;
                }

                // ২. ক্লাউড D1 থেকে অর্ডার ডেটা ফেচ করা
                let totalOrders = 0;
                let totalRevenue = 0.00;

                const tables = ['retail_orders', 'wholesale_orders', 'dropship_orders'];
                for (let table of tables) {
                    try {
                        const orderRes = await fetch(`/api/get?table=${table}`);
                        const orderResData = await orderRes.json();
                        
                        let ordersList = [];
                        if (orderResData.success && Array.isArray(orderResData.data)) {
                            ordersList = orderResData.data;
                        } else if (Array.isArray(orderResData)) {
                            ordersList = orderResData;
                        }

                        totalOrders += ordersList.length;

                        ordersList.forEach(ord => {
                            if (ord.items) {
                                let itemsArr = typeof ord.items === 'string' ? JSON.parse(ord.items) : ord.items;
                                if (Array.isArray(itemsArr)) {
                                    itemsArr.forEach(item => {
                                        let priceNum = parseFloat((item.price || "0").toString().replace('$', '')) || 0;
                                        totalRevenue += priceNum * (item.qty || 1);
                                    });
                                }
                            } else if (ord.total_amount) {
                                totalRevenue += parseFloat(ord.total_amount) || 0;
                            }
                        });
                    } catch (err) {
                        console.warn(`Table ${table} fetch warning:`, err);
                    }
                }

                // ড্যাশবোর্ডে রিয়েল-টাইম তথ্য আপডেট
                document.getElementById('statProductsVal').innerText = productCount;
                document.getElementById('statOrdersVal').innerText = totalOrders;
                document.getElementById('statRevenueVal').innerText = `$${totalRevenue.toFixed(2)}`;
                document.getElementById('statBalanceVal').innerText = `$${(totalRevenue * 0.9).toFixed(2)}`;

            } catch (e) {
                console.error("Cloud D1 Real-time Sync Error:", e);
            }
        }

        // Animated Sparkline Graph Generator with Chart.js
        function createDynamicSparkline(canvasId, dataPoints, isBar = false) {
            const canvas = document.getElementById(canvasId);
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createLinearGradient(0, 0, 0, 60);
            gradient.addColorStop(0, 'rgba(252, 246, 186, 0.65)');
            gradient.addColorStop(1, 'rgba(212, 175, 55, 0.0)');

            return new Chart(ctx, {
                type: isBar ? 'bar' : 'line',
                data: {
                    labels: dataPoints.map((_, i) => `T${i + 1}`),
                    datasets: [{
                        data: dataPoints,
                        borderColor: '#fcf6ba',
                        borderWidth: 2,
                        fill: true,
                        backgroundColor: gradient,
                        tension: 0.4,
                        pointRadius: 0,
                        borderRadius: isBar ? 4 : 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 1500, easing: 'easeOutQuart' },
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    scales: { x: { display: false }, y: { display: false } }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            createDynamicSparkline('chartRevenue', [12, 19, 14, 28, 42, 65, 90, 110]);
            createDynamicSparkline('chartBalance', [0, 0, 0, 0, 0, 0, 0, 0]);
            createDynamicSparkline('chartProducts', [5, 10, 15, 22, 30, 45, 50, 65], true);
            createDynamicSparkline('chartOrders', [2, 6, 4, 12, 18, 25, 40, 55]);
        });
    </script>
</body>
</html>
