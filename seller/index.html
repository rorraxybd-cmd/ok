<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Seller Portal - rorraxy</title>
   
    <!-- সেন্ট্রাল স্ক্রিপ্ট ট্যাগ -->
    <script src="/ecosystem-core.js"></script>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #08080c;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #a0a0ab;
            --font-main: 'Poppins', sans-serif;
            --border-color: rgba(212, 175, 55, 0.22);
            --required-red: #ff4d4d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; overflow-x: hidden; background: var(--bg-retail) !important; color: var(--text-white); font-family: var(--font-main); min-height: 100vh; font-size: 15px; -webkit-font-smoothing: antialiased; }
        body { display: flex; align-items: center; justify-content: center; padding: 20px; text-transform: uppercase; }

        .auth-wrapper {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-card {
            background: var(--card-retail);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            padding: 38px 28px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
        }
        /* লোগো একদম স্পষ্ট এবং শ্যাডো/ইফেক্ট জিরো */
        .auth-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin: 0 auto;
            background: transparent !important;
            filter: none !important;
            box-shadow: none !important;
        }
        .auth-title {
            font-size: 1.3rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: left;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-gray);
            letter-spacing: 0.5px;
        }
        .form-control {
            width: 100%;
            background: #030305;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 16px;
            color: var(--text-white);
            font-size: 0.85rem;
            outline: none;
            font-family: var(--font-main);
            text-transform: none;
            transition: border-color 0.2s ease;
        }
        .form-control:focus {
            border-color: var(--gold-solid);
        }
        .forgot-row {
            display: flex;
            justify-content: flex-end;
            margin-top: -4px;
        }
        .forgot-link {
            color: var(--gold-solid);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            letter-spacing: 0.5px;
        }
        .forgot-link:hover { text-decoration: underline; }

        .auth-btn {
            width: 100%;
            background: var(--gold-gradient);
            border: none;
            border-radius: 14px;
            padding: 15px;
            color: #030305;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: none !important;
            transition: filter 0.2s ease, transform 0.1s ease;
            margin-top: 4px;
        }
        .auth-btn:hover { filter: brightness(1.05); transform: translateY(-1px); }

        .auth-switch {
            font-size: 0.75rem;
            color: var(--text-gray);
            text-transform: none;
            letter-spacing: 0.3px;
            margin-top: 4px;
        }
        .auth-switch a {
            color: var(--gold-solid);
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
            margin-left: 4px;
        }
        .auth-switch a:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            .auth-card { padding: 28px 18px; gap: 18px; }
            .auth-title { font-size: 1.15rem; }
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="Logo" class="auth-logo">
            <h2 class="auth-title" id="formHeading">SELLER PORTAL</h2>

            <!-- Sign In / Sign Up Form -->
            <form id="authForm" class="auth-form">
                <div class="form-group">
                    <label>EMAIL ADDRESS <span style="color:var(--required-red)">*</span></label>
                    <input type="email" class="form-control" id="authEmail" placeholder="Enter your email address..." required style="text-transform: none;">
                </div>
                <div class="form-group">
                    <label>PASSWORD <span style="color:var(--required-red)">*</span></label>
                    <input type="password" class="form-control" id="authPassword" placeholder="Enter secure password..." required style="text-transform: none;">
                </div>
                <div class="forgot-row" id="forgotContainer">
                    <a class="forgot-link" id="forgotPasswordBtn">FORGOT PASSWORD?</a>
                </div>
                <button type="submit" class="auth-btn" id="authSubmitBtn">SIGN IN</button>
            </form>

            <div class="auth-switch" id="authSwitchText">
                DON'T HAVE AN ACCOUNT? <a href="#" id="switchModeBtn">SIGN UP</a>
            </div>
        </div>
    </div>

    <!-- Firebase Authentication & Session Script -->
    <script type="module">
        import { auth } from './firebase.js';
        import { 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            sendPasswordResetEmail,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        let isSignUpMode = false;
        const authForm = document.getElementById('authForm');
        const formHeading = document.getElementById('formHeading');
        const authSubmitBtn = document.getElementById('authSubmitBtn');
        const switchModeBtn = document.getElementById('switchModeBtn');
        const authSwitchText = document.getElementById('authSwitchText');
        const forgotContainer = document.getElementById('forgotContainer');
        const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');

        // ক্যাশ চেক: ইউজার অলরেডি ভেরিফাই বা লগইন করা থাকলে সরাসরি ড্যাশবোর্ডে চলে যাবে
        onAuthStateChanged(auth, (user) => {
            if (user || localStorage.getItem('rorraxy_session_verified') === 'true') {
                window.location.href = 'dashboard.html';
            }
        });

        // সাইন ইন এবং সাইন আপ মোড টগল করার ফাংশন
        switchModeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isSignUpMode = !isSignUpMode;
            if (isSignUpMode) {
                formHeading.innerText = "SELLER SIGN UP";
                authSubmitBtn.innerText = "CREATE ACCOUNT";
                authSwitchText.innerHTML = `ALREADY HAVE AN ACCOUNT? <a href="#" id="switchModeBtn">SIGN IN</a>`;
                forgotContainer.style.display = 'none';
            } else {
                formHeading.innerText = "SELLER PORTAL";
                authSubmitBtn.innerText = "SIGN IN";
                authSwitchText.innerHTML = `DON'T HAVE AN ACCOUNT? <a href="#" id="switchModeBtn">SIGN UP</a>`;
                forgotContainer.style.display = 'flex';
            }
            // রি-বাইন্ড ইভেন্ট লিসেনার
            document.getElementById('switchModeBtn').addEventListener('click', arguments.callee);
        });

        // ফর্ম সাবমিট হ্যান্ডলার (ফায়ারবেস অথেনটিকেশন ও সেশন ক্যাশিং)
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;

            try {
                if (isSignUpMode) {
                    await createUserWithEmailAndPassword(auth, email, password);
                    alert('ACCOUNT CREATED SUCCESSFULLY!');
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    alert('SIGN IN SUCCESSFUL!');
                }
                localStorage.setItem('rorraxy_session_verified', 'true');
                window.location.href = 'dashboard.html';
            } catch (error) {
                alert('AUTHENTICATION ERROR: ' + error.message);
            }
        });

        // পাসওয়ার্ড রিকভারি মেকানিজম
        forgotPasswordBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            if (!email) {
                alert('PLEASE ENTER YOUR EMAIL ADDRESS FIRST TO RECOVER PASSWORD!');
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                alert('PASSWORD RESET LINK SENT TO YOUR EMAIL. PLEASE CHECK YOUR INBOX.');
            } catch (error) {
                alert('ERROR: ' + error.message);
            }
        });
    </script>
</body>
</html>
