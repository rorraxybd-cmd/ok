<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Seller Dashboard - rorraxy Ecosystem</title>
   
    <!-- সেন্ট্রাল স্ক্রিপ্ট ট্যাগ -->
    <script src="/ecosystem-core.js"></script>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #08080c;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-solid: #d4af37;
            --pink-love: #ff2a85;
            --text-white: #ffffff;
            --text-gray: #a0a0ab;
            --font-main: 'Poppins', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; overflow-x: hidden; background: var(--bg-retail) !important; color: var(--text-white); font-family: var(--font-main); min-height: 100vh; font-size: 14px; -webkit-font-smoothing: antialiased; }
        body { padding: 24px 16px 110px 16px; text-transform: uppercase; }
        
        .main-container { 
            width: 100%; 
            max-width: 1200px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* Header Section */
        .dashboard-header { text-align: center; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
        .header-logo-img { width: 90px; height: 90px; object-fit: contain; background: transparent !important; mix-blend-mode: screen; filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.6)); animation: logoLuxuryGlow 3s infinite alternate ease-in-out; }
        @keyframes logoLuxuryGlow { 0% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4)); } 100% { transform: scale(1.05); filter: drop-shadow(0 0 35px rgba(212, 175, 55, 0.85)); } }
        .dashboard-header h1 { font-size: 1.75rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.8px; }

        .header-email-box { display: inline-flex; align-items: center; gap: 8px; background: var(--card-retail); padding: 8px 18px; border-radius: 25px; text-decoration: none; font-size: 0.78rem; color: var(--text-gray); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8); border: 1px solid rgba(212, 175, 55, 0.2); text-transform: lowercase; }
        .header-email-box i { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-email-box span { color: var(--text-white); font-weight: 600; }

        /* Stats Grid Section - Desktop: 4 Columns, Mobile: Vertical Stack (1 Column) */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 16px; 
            margin-bottom: 30px; 
            width: 100%; 
        }

        .stat-card { 
            background: var(--card-retail); 
            border-radius: 18px; 
            padding: 20px 14px 14px 14px; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            gap: 8px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); 
            border: 1px solid rgba(212, 175, 55, 0.15); 
            transition: transform 0.3s ease;
            width: 100%;
            min-width: 0;
        }

        .stat-card:hover { transform: translateY(-4px); border-color: rgba(212, 175, 55, 0.4); }
        .stat-card h3 { font-size: 0.72rem; color: var(--text-gray); font-weight: 600; letter-spacing: 0.5px; white-space: nowrap; }
        .stat-card .value { font-size: 1.35rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .graph-container { width: 100%; height: 60px; margin-top: 6px; position: relative; }

        /* Bottom Fixed Navigation Menu */
        .seller-bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(3, 3, 5, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(212, 175, 55, 0.15); display: flex; justify-content: space-around; align-items: center; padding: 12px 6px; z-index: 1000; box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.9); }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; transition: transform 0.2s ease; flex: 1; background: none; border: none; cursor: pointer; }
        .nav-item:hover { transform: translateY(-2px); }
        .nav-item i { font-size: 1.25rem; margin-bottom: 4px; color: var(--text-gray); }
        .nav-item span { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.5px; color: var(--text-gray); }

        /* Floating Live Chat Button */
        .chat-widget-btn { position: fixed; bottom: 80px; right: 18px; width: 52px; height: 52px; border-radius: 50%; background: var(--card-retail); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.9); display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 1500; border: 1px solid rgba(212, 175, 55, 0.3); transition: transform 0.3s ease; }
        .chat-widget-btn:hover { transform: scale(1.08); }
        .chat-widget-btn i { font-size: 1.35rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Admin Direct Chat Box Window */
        .chat-box-container { position: fixed; bottom: 145px; right: 18px; width: 330px; height: 410px; background: var(--card-retail); border-radius: 18px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.95); display: flex; flex-direction: column; overflow: hidden; z-index: 1500; opacity: 0; visibility: hidden; transform: translateY(20px) scale(0.95); transition: all 0.3s ease; text-transform: none; border: 1px solid rgba(212, 175, 55, 0.2); }
        .chat-box-container.active { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
        .chat-header { background: #030305; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; }
        .chat-header-info { display: flex; align-items: center; gap: 10px; }
        .chat-status-dot { width: 8px; height: 8px; background: var(--pink-love); border-radius: 50%; box-shadow: 0 0 10px var(--pink-love); }
        .chat-header h4 { font-size: 0.85rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        .chat-close-btn { background: none; border: none; color: var(--text-gray); font-size: 1.15rem; cursor: pointer; }
        .chat-close-btn:hover { color: var(--gold-solid); }
        .chat-messages { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #000000; }
        .chat-msg { max-width: 82%; padding: 10px 14px; border-radius: 12px; font-size: 0.78rem; line-height: 1.4; word-wrap: break-word; }
        .msg-admin { align-self: flex-start; background: #08080c; color: var(--text-white); }
        .msg-seller { align-self: flex-end; background: var(--gold-gradient); color: #000000; font-weight: 600; }
        .chat-input-area { padding: 12px; background: #030305; display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; background: #000000; border: none; border-radius: 20px; padding: 10px 16px; color: var(--text-white); font-size: 0.78rem; outline: none; }
        .chat-send-btn { background: var(--gold-gradient); border: none; width: 36px; height: 36px; border-radius: 50%; color: #000; display: flex; justify-content: center; align-items: center; cursor: pointer; }

        /* Media Queries for Responsive Perfection */
        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
        }

        @media (max-width: 600px) {
            body { padding: 16px 12px 100px 12px; }
            .stats-grid { grid-template-columns: 1fr; gap: 12px; }
            .chat-box-container { right: 12px; left: 12px; width: auto; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- Header -->
        <header class="dashboard-header">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="rorraxy Logo" class="header-logo-img">
            <h1>SELLER DASHBOARD</h1>
            <a href="mailto:seller@rorraxy.com?subject=Seller%20Support%20Query" class="header-email-box">
                <i class="fa-solid fa-envelope"></i>
                <span>seller@rorraxy.com</span>
            </a>
        </header>

        <!-- Stats Overview with Animated Graphs & Perfect Grid Layout -->
        <section class="stats-grid">
            <div class="stat-card">
                <h3>TOTAL REVENUE</h3>
                <div class="value" id="statRevenueVal">$0.00</div>
                <div class="graph-container"><canvas id="chartRevenue"></canvas></div>
            </div>
            <div class="stat-card">
                <h3>TOTAL BALANCE</h3>
                <div class="value" id="statBalanceVal">$0.00</div>
                <div class="graph-container"><canvas id="chartBalance"></canvas></div>
            </div>
            <div class="stat-card">
                <h3>TOTAL PRODUCT</h3>
                <div class="value" id="statProductsVal">0</div>
                <div class="graph-container"><canvas id="chartProducts"></canvas></div>
            </div>
            <div class="stat-card">
                <h3>TOTAL ORDER</h3>
                <div class="value" id="statOrdersVal">0</div>
                <div class="graph-container"><canvas id="chartOrders"></canvas></div>
            </div>
        </section>

    </div>

    <!-- Seller Bottom Navigation Menu -->
    <nav class="seller-bottom-nav">
        <a href="/seller/list.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>LIST</span>
        </a>
        <a href="/seller/payout.html" class="nav-item">
            <i class="fa-solid fa-hand-holding-dollar"></i>
            <span>PAYOUT</span>
        </a>
        <a href="/seller/upload.html" class="nav-item">
            <i class="fa-solid fa-plus"></i>
            <span>UPLOAD</span>
        </a>
        <a href="/seller/shipment.html" class="nav-item">
            <i class="fa-solid fa-truck-fast"></i>
            <span>SHIPMENT</span>
        </a>
        <a href="/seller/info.html" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>INFO</span>
        </a>
    </nav>

    <!-- Floating Live Support Chat Button -->
    <div class="chat-widget-btn" id="toggleChatBtn">
        <i class="fa-solid fa-headset"></i>
    </div>

    <!-- Admin Direct Chat Box Window -->
    <div class="chat-box-container" id="adminChatContainer">
        <div class="chat-header">
            <div class="chat-header-info">
                <div class="chat-status-dot"></div>
                <h4>ADMIN SUPPORT</h4>
            </div>
            <button class="chat-close-btn" id="closeChatBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-msg msg-admin">
                Welcome to rorraxy Seller Support. How can we help you today?
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Type your issue..." />
            <button class="chat-send-btn" id="sendMsgBtn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- 100% Cloud D1 Pure Real-Time Synchronized Logic -->
    <script>
        const API_BASE_URL = 'https://s.rorraxybd.workers.dev';

        window.onload = function() {
            loadPureCloudDashboardStats();
            // প্রতি ৩ সেকেন্ড পর পর অটোমেটিক ক্লাউড থেকে আপডেট চেক করবে (Real-time polling)
            setInterval(loadPureCloudDashboardStats, 3000);
        };

        async function loadPureCloudDashboardStats() {
            try {
                // ১. ক্লাউড D1 থেকে সরাসরি প্রোডাক্ট সংখ্যা আনা
                const prodResponse = await fetch(`${API_BASE_URL}/api/get?table=products`);
                const prodResult = await prodResponse.json();
                
                let productCount = 0;
                if (prodResult.success && Array.isArray(prodResult.data)) {
                    productCount = prodResult.data.length;
                } else if (Array.isArray(prodResult)) {
                    productCount = prodResult.length;
                }

                // ২. ক্লাউড D1 থেকে সমস্ত অর্ডার ও রেভিনিউ তথ্য ফেচ করা (Retail, Wholesale, Dropship)
                let totalOrders = 0;
                let totalRevenue = 0.00;

                const tables = ['retail_orders', 'wholesale_orders', 'dropship_orders'];
                
                for (let table of tables) {
                    try {
                        const orderRes = await fetch(`${API_BASE_URL}/api/get?table=${table}`);
                        const orderResData = await orderRes.json();
                        
                        let ordersList = [];
                        if (orderResData.success && Array.isArray(orderResData.data)) {
                            ordersList = orderResData.data;
                        } else if (Array.isArray(orderResData)) {
                            ordersList = orderResData;
                        }

                        totalOrders += ordersList.length;

                        ordersList.forEach(ord => {
                            if (ord.items) {
                                let itemsArr = typeof ord.items === 'string' ? JSON.parse(ord.items) : ord.items;
                                if (Array.isArray(itemsArr)) {
                                    itemsArr.forEach(item => {
                                        let priceNum = parseFloat((item.price || "0").toString().replace('$', '')) || 0;
                                        totalRevenue += priceNum * (item.qty || 1);
                                    });
                                }
                            }
                        });
                    } catch (err) {
                        console.warn(`Table ${table} fetch warning:`, err);
                    }
                }

                // ৩. ড্যাশবোর্ডে ক্লাউডের রিয়েল-টাইম তথ্য আপডেট
                document.getElementById('statProductsVal').innerText = productCount;
                document.getElementById('statOrdersVal').innerText = totalOrders;
                document.getElementById('statRevenueVal').innerText = `$${totalRevenue.toFixed(2)}`;
                // ব্যালেন্স হিসেবে ৯০% (অটো হিসাব)
                document.getElementById('statBalanceVal').innerText = `$${(totalRevenue * 0.9).toFixed(2)}`;

            } catch (e) {
                console.error("Cloud D1 Real-time Sync Error:", e);
            }
        }

        // Live Chat Widget Toggle Logic
        const toggleChatBtn = document.getElementById('toggleChatBtn');
        const closeChatBtn = document.getElementById('closeChatBtn');
        const adminChatContainer = document.getElementById('adminChatContainer');
        const sendMsgBtn = document.getElementById('sendMsgBtn');
        const chatInput = document.getElementById('chatInput');
        const chatMessages = document.getElementById('chatMessages');

        toggleChatBtn.addEventListener('click', () => adminChatContainer.classList.toggle('active'));
        closeChatBtn.addEventListener('click', () => adminChatContainer.classList.remove('active'));

        function sendSellerMessage() {
            const text = chatInput.value.trim();
            if (text !== "") {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'chat-msg msg-seller';
                msgDiv.innerText = text;
                chatMessages.appendChild(msgDiv);
                chatInput.value = "";
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        sendMsgBtn.addEventListener('click', sendSellerMessage);
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendSellerMessage(); });

        // Animated Sparkline Graph Generator with Chart.js
        function createDynamicSparkline(canvasId, dataPoints, isBar = false) {
            const canvas = document.getElementById(canvasId);
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createLinearGradient(0, 0, 0, 60);
            gradient.addColorStop(0, 'rgba(252, 246, 186, 0.65)');
            gradient.addColorStop(1, 'rgba(212, 175, 55, 0.0)');

            return new Chart(ctx, {
                type: isBar ? 'bar' : 'line',
                data: {
                    labels: dataPoints.map((_, i) => `T${i + 1}`),
                    datasets: [{
                        data: dataPoints,
                        borderColor: '#fcf6ba',
                        borderWidth: 2,
                        fill: true,
                        backgroundColor: gradient,
                        tension: 0.4,
                        pointRadius: 0,
                        borderRadius: isBar ? 4 : 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 1500, easing: 'easeOutQuart' },
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    scales: { x: { display: false }, y: { display: false } }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            createDynamicSparkline('chartRevenue', [12, 19, 14, 28, 42, 65, 90, 110]);
            createDynamicSparkline('chartBalance', [0, 0, 0, 0, 0, 0, 0, 0]);
            createDynamicSparkline('chartProducts', [5, 10, 15, 22, 30, 45, 50, 65], true);
            createDynamicSparkline('chartOrders', [2, 6, 4, 12, 18, 25, 40, 55]);
        });
    </script>
</body>
</html>
