<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Affiliate Portal - rorraxy</title>
   
    <!-- Ecosystem Core Script -->
    <script src="/ecosystem-core.js"></script>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #0a0a0f;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);  
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #8e8e99;
            --font-main: 'Poppins', sans-serif;
            --required-red: #ff4d4d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; overflow-x: hidden; background: var(--bg-retail) !important; color: var(--text-white); font-family: var(--font-main); min-height: 100vh; font-size: 15px; -webkit-font-smoothing: antialiased; }
        body { display: flex; align-items: center; justify-content: center; padding: 20px; text-transform: uppercase; }

        .auth-wrapper {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .auth-card {
            background: rgba(10, 10, 15, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 28px;
            width: 100%;
            padding: 44px 32px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
        }

        .auth-logo {
            width: 140px;
            height: auto;
            max-height: 140px;
            object-fit: contain;
            margin: 0 auto;
            background: transparent !important;
            filter: drop-shadow(0 6px 20px rgba(212, 175, 55, 0.2)) !important;
        }

        .auth-title {
            font-size: 1.2rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
            margin-top: -6px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: left;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-gray);
            letter-spacing: 0.8px;
        }

        .form-control {
            width: 100%;
            background: #030305;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 15px 18px;
            color: var(--text-white);
            font-size: 0.88rem;
            outline: none;
            font-family: var(--font-main);
            text-transform: none;
            transition: all 0.25s ease;
        }

        .form-control:focus {
            border-color: var(--gold-solid);
            background: #000000;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.15);
        }

        .email-hint {
            font-size: 0.65rem;
            color: var(--text-gray);
            text-transform: none;
            letter-spacing: 0.3px;
            margin-top: 2px;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .auth-btn {
            width: 100%;
            background: var(--gold-gradient);
            border: none;
            border-radius: 16px;
            padding: 16px;
            color: #030305;
            font-weight: 800;
            font-size: 0.88rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.15s ease, filter 0.2s ease;
            margin-top: 6px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .auth-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
        .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .status-msg {
            font-size: 0.75rem;
            text-transform: none;
            margin-top: -4px;
            display: none;
            text-align: center;
        }
        .status-msg.error { color: var(--required-red); }
        .status-msg.success { color: #2ecc71; }

        /* লাক্সারি গোল্ডেন গ্র্যাডিয়েন্ট ভেরিফিকেশন বাটন বক্স */
        .action-link-box {
            display: none;
            margin-top: 10px;
            text-align: center;
        }

        .verify-action-btn {
            width: 100%;
            background: var(--gold-gradient);
            border: none;
            border-radius: 16px;
            padding: 16px;
            color: #030305;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            transition: all 0.25s ease;
        }

        .verify-action-btn:hover {
            filter: brightness(1.15);
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
        }

        @media (max-width: 480px) {
            .auth-card { padding: 34px 20px; gap: 18px; }
            .auth-title { font-size: 1.05rem; }
            .auth-logo { width: 120px; }
        }
    </style>
</head>
<body>

    <script>
        if (localStorage.getItem('rorraxy_affiliate_verified') === 'true') {
            window.location.href = 'dashboard.html';
        }
    </script>

    <div class="auth-wrapper">
        <div class="auth-card">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="rorraxy logo" class="auth-logo">
            
            <h2 class="auth-title">AFFILIATE VERIFICATION</h2>

            <!-- Authentication Form -->
            <form id="magicLinkForm" class="auth-form">
                <div class="form-group">
                    <label>EMAIL ADDRESS <span style="color:var(--required-red)">*</span></label>
                    <input type="email" class="form-control" id="affiliateEmail" placeholder="Enter your email address..." required style="text-transform: none;" autocomplete="email">
                    <span class="email-hint"><i class="fa-regular fa-shield-halved" style="color: var(--gold-solid);"></i> Secure Instant Verification</span>
                </div>
                
                <div id="formStatus" class="status-msg"></div>
                
                <!-- গোল্ডেন গ্র্যাডিয়েন্ট ভেরিফিকেশন বাটন (URL হাইড করা থাকবে) -->
                <div id="actionLinkBox" class="action-link-box">
                    <a id="verifyDirectBtn" href="#" target="_blank" class="verify-action-btn">
                        <i class="fa-solid fa-lock"></i> VERIFY & ENTER DASHBOARD
                    </a>
                </div>

                <button type="submit" class="auth-btn" id="sendLinkBtn">GENERATE SECURE ENTRY</button>
            </form>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://email.rorraxybd.workers.dev";

        const magicLinkForm = document.getElementById('magicLinkForm');
        const affiliateEmailInput = document.getElementById('affiliateEmail');
        const sendLinkBtn = document.getElementById('sendLinkBtn');
        const formStatus = document.getElementById('formStatus');
        const actionLinkBox = document.getElementById('actionLinkBox');
        const verifyDirectBtn = document.getElementById('verifyDirectBtn');

        function showStatus(element, message, isError = false) {
            element.innerText = message;
            element.className = 'status-msg ' + (isError ? 'error' : 'success');
            element.style.display = 'block';
        }

        magicLinkForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = affiliateEmailInput.value.trim().toLowerCase();

            if (!email) return;

            sendLinkBtn.disabled = true;
            sendLinkBtn.innerText = "PROCESSING SECURE TOKEN...";
            formStatus.style.display = 'none';
            actionLinkBox.style.display = 'none';

            try {
                const response = await fetch(`${WORKER_URL}/api/send-magic-link`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showStatus(formStatus, 'Identity token created! Click button below to complete entry:', false);
                    
                    if (data.magicLink) {
                        verifyDirectBtn.href = data.magicLink;
                        actionLinkBox.style.display = 'block';
                    }
                    
                    sendLinkBtn.style.display = 'none'; // প্রাইমারি বাটন হাইড হয়ে যাবে
                } else {
                    showStatus(formStatus, data.error || 'Verification failed. Try again.', true);
                    sendLinkBtn.disabled = false;
                    sendLinkBtn.innerText = "GENERATE SECURE ENTRY";
                }
            } catch (err) {
                showStatus(formStatus, 'Network error! Please check connection.', true);
                sendLinkBtn.disabled = false;
                sendLinkBtn.innerText = "GENERATE SECURE ENTRY";
            }
        });
    </script>
</body>
</html>
