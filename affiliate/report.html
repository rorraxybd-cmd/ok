<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiliate Report - rorraxy Ecosystem</title>
    
    <script src="/ecosystem-core.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --bg-retail: #000000; --card-retail: #08080c; --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%); --gold-solid: #d4af37; --text-white: #ffffff; --text-gray: #a0a0ab; --font-main: 'Poppins', sans-serif; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-retail); color: var(--text-white); font-family: var(--font-main); padding: 24px 16px 110px 16px; text-transform: uppercase; }
        .main-container { width: 100%; max-width: 1100px; margin: 0 auto; }
        .dashboard-header { text-align: center; margin-bottom: 25px; }
        .dashboard-header h1 { font-size: 1.5rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .report-summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 25px; }
        .summary-card { background: var(--card-retail); border-radius: 18px; padding: 20px 14px; text-align: center; border: 1px solid rgba(212,175,55,0.15); }
        .summary-card .val { font-size: 1.35rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .report-card { background: var(--card-retail); border-radius: 18px; padding: 24px 20px; border: 1px solid rgba(212,175,55,0.15); }
        table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
        th, td { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.78rem; }
        th { color: var(--text-gray); font-size: 0.68rem; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.62rem; font-weight: 700; }
        .badge.pending { background: rgba(234, 179, 8, 0.12); color: #facc15; }
        .badge.confirmed { background: rgba(34, 197, 94, 0.12); color: #4ade80; }
        .affiliate-bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(3, 3, 5, 0.95); border-top: 1px solid rgba(212, 175, 55, 0.15); display: flex; justify-content: space-around; align-items: center; padding: 12px 6px; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; flex: 1; background: none; border: none; }
        .nav-item i, .nav-item span { color: var(--text-gray); font-size: 0.62rem; }
        @media (max-width: 768px) { .report-summary-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="main-container">
        <header class="dashboard-header"><h1>AFFILIATE CONVERSION REPORT</h1></header>
        <section class="report-summary-grid">
            <div class="summary-card"><h3>PENDING COMMISSIONS</h3><div class="val">$12.50</div></div>
            <div class="summary-card"><h3>CONFIRMED COMMISSIONS</h3><div class="val">$53.00</div></div>
            <div class="summary-card"><h3>TOTAL CLICKS</h3><div class="val">1,420</div></div>
        </section>
        <section class="report-card">
            <table>
                <thead><tr><th>DATE</th><th>ORDER ID</th><th>STORE TYPE</th><th>COMMISSION</th><th>STATUS</th></tr></thead>
                <tbody>
                    <tr><td>2026-10-10</td><td>#RRX-98214</td><td>Retail (7%)</td><td>$12.50</td><td><span class="badge pending">PENDING</span></td></tr>
                    <tr><td>2026-10-09</td><td>#RRX-98102</td><td>Wholesale (2%)</td><td>$45.00</td><td><span class="badge confirmed">CONFIRMED</span></td></tr>
                </tbody>
            </table>
        </section>
    </div>

    <nav class="affiliate-bottom-nav">
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i><span>DASHBOARD</span></a>
        <a href="payout.html" class="nav-item"><i class="fa-solid fa-hand-holding-dollar"></i><span>PAYOUT</span></a>
        <a href="report.html" class="nav-item active"><i class="fa-solid fa-chart-column"></i><span>REPORT</span></a>
        <a href="info.html" class="nav-item"><i class="fa-solid fa-user"></i><span>INFO</span></a>
    </nav>
</body>
</html>
