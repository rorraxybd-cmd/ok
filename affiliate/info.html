<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Affiliate Profile & Info - rorraxy Ecosystem</title>
    
    <!-- সেন্ট্রাল ক্লাউডফ্লেয়ার ইকোসিস্টেম কোর স্ক্রিপ্ট -->
    <script src="/ecosystem-core.js"></script>
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #08080c;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #a0a0ab;
            --font-main: 'Poppins', sans-serif;
            --required-red: #ff4d4d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; overflow-x: hidden; background: var(--bg-retail) !important; color: var(--text-white); font-family: var(--font-main); min-height: 100vh; font-size: 14px; }
        body { padding: 24px 16px 110px 16px; text-transform: uppercase; }
        .main-container { width: 100%; max-width: 900px; margin: 0 auto; }

        .dashboard-header { text-align: center; margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .header-logo-img { width: 90px; height: 90px; object-fit: contain; filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.6)); }
        .dashboard-header h1 { font-size: 1.5rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .info-card, .profile-summary-card { background: var(--card-retail); border-radius: 18px; padding: 24px 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); border: 1px solid rgba(212, 175, 55, 0.15); }
        .profile-summary-card { display: none; }
        .info-card.hidden { display: none; }

        .section-title { font-size: 0.85rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(212, 175, 55, 0.15); padding-bottom: 8px; }
        
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full-width { grid-column: span 2; }
        .form-group label { font-size: 0.72rem; font-weight: 700; color: var(--text-gray); }
        .req-star { color: var(--required-red); margin-left: 3px; }

        .form-control, .form-select { width: 100%; background: #040407; border: none; border-radius: 12px; padding: 12px 16px; color: var(--text-white); font-size: 0.8rem; outline: none; font-family: var(--font-main); text-transform: none; box-shadow: inset 0 2px 6px rgba(0,0,0,0.8); }
        .form-select option { background: #08080c; color: #fff; }

        .dynamic-payment-container { grid-column: span 2; display: flex; flex-direction: column; gap: 12px; background: #040407; padding: 16px; border-radius: 14px; border: 1px solid rgba(212, 175, 55, 0.2); }
        .payment-field-group { display: none; flex-direction: column; gap: 12px; }
        .payment-field-group.active { display: flex; }

        .submit-btn, .edit-profile-btn { background: var(--gold-gradient); color: #000; border: none; width: 100%; padding: 14px; border-radius: 14px; font-weight: 800; font-size: 0.85rem; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(212,175,55,0.3); }

        .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 20px; text-transform: none; }
        .summary-item { background: #040407; padding: 12px 14px; border-radius: 12px; display: flex; flex-direction: column; gap: 4px; }
        .summary-item.full-width { grid-column: span 2; }
        .summary-item label { font-size: 0.62rem; color: var(--gold-solid); font-weight: 700; }
        .summary-item span { font-size: 0.78rem; color: var(--text-white); word-break: break-all; }

        .affiliate-bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(3, 3, 5, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(212, 175, 55, 0.15); display: flex; justify-content: space-around; align-items: center; padding: 12px 6px; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; flex: 1; background: none; border: none; cursor: pointer; }
        .nav-item.active i, .nav-item.active span { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-item i { font-size: 1.25rem; margin-bottom: 4px; color: var(--text-gray); }
        .nav-item span { font-size: 0.62rem; font-weight: 700; color: var(--text-gray); }

        @media (max-width: 768px) { .form-grid, .summary-grid { grid-template-columns: 1fr; } .form-group.full-width, .summary-item.full-width, .dynamic-payment-container { grid-column: span 1; } }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="dashboard-header">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="Logo" class="header-logo-img">
            <h1>AFFILIATE PROFILE & INFO</h1>
        </header>

        <!-- ফরম কার্ড -->
        <div class="info-card" id="infoFormCard">
            <div class="section-title"><i class="fa-solid fa-user-shield"></i> MANDATORY AFFILIATE INFORMATION</div>
            <form id="affiliateInfoForm" onsubmit="saveAffiliateInfo(event)">
                <div class="form-grid">
                    <div class="form-group"><label>FIRST NAME <span class="req-star">*</span></label><input type="text" id="firstName" class="form-control" placeholder="FIRST NAME" required></div>
                    <div class="form-group"><label>LAST NAME <span class="req-star">*</span></label><input type="text" id="lastName" class="form-control" placeholder="LAST NAME" required></div>
                    <div class="form-group"><label>EMAIL ADDRESS <span class="req-star">*</span></label><input type="email" id="email" class="form-control" placeholder="name@gmail.com" required style="text-transform:lowercase;"></div>
                    <div class="form-group"><label>WHATSAPP / PHONE <span class="req-star">*</span></label><input type="tel" id="phone" class="form-control" placeholder="+8801700000000" required></div>
                    <div class="form-group full-width"><label>PROMOTIONAL CHANNEL <span class="req-star">*</span></label><input type="text" id="promoChannel" class="form-control" placeholder="YOUTUBE, FACEBOOK OR WEBSITE URL" required></div>
                    
                    <div class="form-group full-width">
                        <label>PREFERRED PAYMENT METHOD <span class="req-star">*</span></label>
                        <select id="paymentMethod" class="form-select" onchange="handlePaymentMethodChange()" required>
                            <option value="">SELECT METHOD</option>
                            <option value="bKash">bKash</option>
                            <option value="Nagad">Nagad</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                            <option value="Payoneer">Payoneer</option>
                            <option value="Crypto USDT">Crypto USDT (TRC20)</option>
                        </select>
                    </div>

                    <div id="dynamicPaymentContainer" class="dynamic-payment-container" style="display: none;">
                        <div id="field_bKash" class="payment-field-group"><div class="form-group"><label>BKASH NUMBER *</label><input type="tel" id="bkashNumber" class="form-control" placeholder="11-digit bKash number"></div></div>
                        <div id="field_Nagad" class="payment-field-group"><div class="form-group"><label>NAGAD NUMBER *</label><input type="tel" id="nagadNumber" class="form-control" placeholder="11-digit Nagad number"></div></div>
                        <div id="field_Bank" class="payment-field-group">
                            <div class="form-group"><label>BANK NAME *</label><input type="text" id="bankName" class="form-control" placeholder="Bank name"></div>
                            <div class="form-group"><label>ACCOUNT NUMBER *</label><input type="text" id="bankAccountNumber" class="form-control" placeholder="Account number"></div>
                        </div>
                    </div>
                </div>
                <button type="submit" class="submit-btn"><i class="fa-solid fa-floppy-disk"></i> SAVE & SYNC TO CLOUDFLARE D1</button>
            </form>
        </div>

        <!-- সাবমিট হওয়ার পর গোছানো সামারি কার্ড -->
        <div class="profile-summary-card" id="profileSummaryCard">
            <div class="section-title">VERIFIED AFFILIATE PROFILE <span style="color:#4ade80; margin-left:auto; font-size:0.7rem;">SYNCED</span></div>
            <div class="summary-grid">
                <div class="summary-item"><label>FULL NAME</label><span id="sumName"></span></div>
                <div class="summary-item"><label>EMAIL</label><span id="sumEmail"></span></div>
                <div class="summary-item"><label>PHONE</label><span id="sumPhone"></span></div>
                <div class="summary-item"><label>PAYOUT METHOD</label><span id="sumMethod"></span></div>
                <div class="summary-item full-width"><label>PROMOTIONAL CHANNEL</label><span id="sumChannel"></span></div>
            </div>
            <button type="button" class="edit-profile-btn" id="editProfileBtn"><i class="fa-solid fa-pen-to-square"></i> EDIT PROFILE INFO</button>
        </div>
    </div>

    <!-- বটম নেভিগেশন মেনু -->
    <nav class="/affiliate/affiliate-bottom-nav">
        <a href="/affiliate/dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i><span>DASHBOARD</span></a>
        <a href="/affiliate/payout.html" class="nav-item"><i class="fa-solid fa-hand-holding-dollar"></i><span>PAYOUT</span></a>
        <a href="/affiliate/report.html" class="nav-item"><i class="fa-solid fa-chart-column"></i><span>REPORT</span></a>
        <a href="/affiliate/link.html" class="nav-item"><i class="fa-solid fa-link"></i><span>LINK</span></a>
        <a href="/affiliate/info.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>INFO</span></a>
    </nav>

    <script>
        const WORKER_SAVE_API = "https://s.rorraxybd.workers.dev/api/save";

        function handlePaymentMethodChange() {
            const method = document.getElementById('paymentMethod').value;
            const container = document.getElementById('dynamicPaymentContainer');
            document.querySelectorAll('.payment-field-group').forEach(group => group.classList.remove('active'));
            if (!method) { container.style.display = 'none'; return; }
            container.style.display = 'flex';
            const activeGroup = document.getElementById(`field_${method.replace(' ', '')}`);
            if (activeGroup) activeGroup.classList.add('active');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedInfo = localStorage.getItem('rorraxy_affiliate_info');
            if(savedInfo) {
                try {
                    const data = JSON.parse(savedInfo);
                    document.getElementById('firstName').value = data.firstName || '';
                    document.getElementById('lastName').value = data.lastName || '';
                    document.getElementById('email').value = data.email || '';
                    document.getElementById('phone').value = data.phone || '';
                    document.getElementById('promoChannel').value = data.promoChannel || '';
                    document.getElementById('paymentMethod').value = data.paymentMethod || '';
                    handlePaymentMethodChange();
                    renderSummaryCard(data);
                } catch(e) { console.error(e); }
            }
        });

        function renderSummaryCard(data) {
            document.getElementById('sumName').innerText = `${data.firstName} ${data.lastName}`;
            document.getElementById('sumEmail').innerText = data.email;
            document.getElementById('sumPhone').innerText = data.phone;
            document.getElementById('sumMethod').innerText = data.paymentMethod;
            document.getElementById('sumChannel').innerText = data.promoChannel;

            document.getElementById('infoFormCard').classList.add('hidden');
            document.getElementById('profileSummaryCard').style.display = 'block';
        }

        document.getElementById('editProfileBtn').addEventListener('click', () => {
            document.getElementById('profileSummaryCard').style.display = 'none';
            document.getElementById('infoFormCard').classList.remove('hidden');
        });

        async function saveAffiliateInfo(e) {
            e.preventDefault();
            const formData = {
                first_name: document.getElementById('firstName').value.trim(),
                last_name: document.getElementById('lastName').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                promo_channel: document.getElementById('promoChannel').value.trim(),
                payment_method: document.getElementById('paymentMethod').value
            };

            // Local storage backup
            localStorage.setItem('rorraxy_affiliate_info', JSON.stringify({
                firstName: formData.first_name,
                lastName: formData.last_name,
                email: formData.email,
                phone: formData.phone,
                promoChannel: formData.promo_channel,
                paymentMethod: formData.payment_method
            }));
            localStorage.setItem('rorraxy_affiliate_info_completed', 'true');

            // Cloudflare D1 Database Sync via worker.js (/api/save)
            try {
                const response = await fetch(WORKER_SAVE_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        table: "affiliate_info",
                        data: formData
                    })
                });
                const result = await response.json();
                if(!result.success) throw new Error(result.error);
            } catch(err) {
                console.warn("Cloudflare D1 sync warning, fallback active.");
            }

            renderSummaryCard({
                firstName: formData.first_name,
                lastName: formData.last_name,
                email: formData.email,
                phone: formData.phone,
                paymentMethod: formData.payment_method,
                promoChannel: formData.promo_channel
            });

            alert('AFFILIATE INFO SAVED & SYNCED TO CLOUDFLARE D1 SUCCESSFULLY!');
        }
    </script>
</body>
</html>
