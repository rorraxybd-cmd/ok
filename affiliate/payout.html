<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Affiliate Payout - rorraxy Ecosystem</title>
    
    <script src="/ecosystem-core.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #08080c;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #a0a0ab;
            --font-main: 'Poppins', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; overflow-x: hidden; background: var(--bg-retail) !important; color: var(--text-white); font-family: var(--font-main); min-height: 100vh; font-size: 14px; }
        body { padding: 24px 16px 110px 16px; text-transform: uppercase; }
        .main-container { width: 100%; max-width: 900px; margin: 0 auto; }

        .dashboard-header { text-align: center; margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .header-logo-img { width: 90px; height: 90px; object-fit: contain; filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.6)); }
        .dashboard-header h1 { font-size: 1.5rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .balance-banner { background: var(--card-retail); border-radius: 18px; padding: 24px 20px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); margin-bottom: 25px; border: 1px solid rgba(212, 175, 55, 0.15); }
        .balance-banner h3 { font-size: 0.72rem; color: var(--text-gray); font-weight: 600; margin-bottom: 8px; }
        .balance-banner .amount { font-size: 2.2rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .payout-card, .history-card { background: var(--card-retail); border-radius: 18px; padding: 24px 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); margin-bottom: 25px; border: 1px solid rgba(212, 175, 55, 0.15); }
        .card-title { font-size: 0.85rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 16px; border-bottom: 1px solid rgba(212, 175, 55, 0.15); padding-bottom: 8px; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--text-gray); margin-bottom: 6px; }
        .form-control, .form-select { width: 100%; background: #040407; border: none; border-radius: 12px; padding: 12px 16px; color: var(--text-white); font-size: 0.8rem; outline: none; font-family: var(--font-main); text-transform: none; box-shadow: inset 0 2px 6px rgba(0,0,0,0.8); }
        .form-select option { background: #08080c; color: var(--text-white); }
        
        .withdraw-btn { width: 100%; background: var(--gold-gradient); border: none; border-radius: 14px; padding: 14px; color: #000; font-weight: 800; font-size: 0.85rem; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
        th { font-size: 0.68rem; color: var(--text-gray); font-weight: 700; padding: 10px 14px; border-bottom: 1px solid rgba(212, 175, 55, 0.15); }
        td { font-size: 0.78rem; padding: 12px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.62rem; font-weight: 700; }
        .badge.pending { background: rgba(234, 179, 8, 0.12); color: #facc15; }
        .badge.paid { background: rgba(34, 197, 94, 0.12); color: #4ade80; }

        .affiliate-bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(3, 3, 5, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(212, 175, 55, 0.15); display: flex; justify-content: space-around; align-items: center; padding: 12px 6px; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; flex: 1; background: none; border: none; cursor: pointer; }
        .nav-item.active i, .nav-item.active span { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-item i { font-size: 1.25rem; margin-bottom: 4px; color: var(--text-gray); }
        .nav-item span { font-size: 0.62rem; font-weight: 700; color: var(--text-gray); }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="dashboard-header">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="Logo" class="header-logo-img">
            <h1>AFFILIATE PAYOUT</h1>
        </header>

        <section class="balance-banner">
            <h3>AVAILABLE WITHDRAWABLE BALANCE</h3>
            <div class="amount" id="availableBalanceDisplay">$450.00</div>
        </section>

        <section class="payout-card">
            <div class="card-title">REQUEST COMMISSION WITHDRAWAL</div>
            <form id="payoutForm" onsubmit="submitPayoutRequest(event)">
                <div class="form-group">
                    <label>WITHDRAWAL AMOUNT ($)</label>
                    <input type="number" class="form-control" id="withdrawAmount" placeholder="Enter amount (Min. $20)..." min="20" required>
                </div>
                <div class="form-group">
                    <label>PAYMENT METHOD</label>
                    <select class="form-select" id="paymentMethod" required>
                        <option value="bKash">bKash (Mobile Banking)</option>
                        <option value="Nagad">Nagad (Mobile Banking)</option>
                        <option value="Bank">Bank Transfer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ACCOUNT NUMBER / DETAILS</label>
                    <input type="text" class="form-control" id="accountNumberInput" placeholder="Enter account or mobile number..." required>
                </div>
                <button type="submit" class="withdraw-btn"><i class="fa-solid fa-paper-plane"></i> SUBMIT WITHDRAWAL TO CLOUDFLARE</button>
            </form>
        </section>

        <section class="history-card">
            <div class="card-title">PAYOUT HISTORY & STATUS</div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr><th>DATE / TIME</th><th>METHOD</th><th>AMOUNT</th><th>STATUS</th></tr>
                    </thead>
                    <tbody id="payoutTableBody">
                        <tr><td>2026-10-09 18:20</td><td>bKash</td><td>$120.00</td><td><span class="badge pending">PENDING</span></td></tr>
                        <tr><td>2026-10-01 10:00</td><td>bKash</td><td>$50.00</td><td><span class="badge paid">PAID</span></td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <nav class="affiliate-bottom-nav">
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i><span>DASHBOARD</span></a>
        <a href="payout.html" class="nav-item active"><i class="fa-solid fa-hand-holding-dollar"></i><span>PAYOUT</span></a>
        <a href="report.html" class="nav-item"><i class="fa-solid fa-chart-column"></i><span>REPORT</span></a>
        <a href="link.html" class="nav-item"><i class="fa-solid fa-link"></i><span>LINK</span></a>
        <a href="info.html" class="nav-item"><i class="fa-solid fa-user"></i><span>INFO</span></a>
    </nav>

    <script>
        const WORKER_SAVE_API = "https://s.rorraxybd.workers.dev/api/save";

        async function submitPayoutRequest(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const method = document.getElementById('paymentMethod').value;
            const details = document.getElementById('accountNumberInput').value;

            if(amount < 20) { alert("Minimum withdrawal amount is $20."); return; }

            try {
                await fetch(WORKER_SAVE_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ table: "affiliate_payout", data: { amount, method, account_details: details, status: "PENDING" } })
                });
                alert("Withdrawal request submitted & synced to Cloudflare D1 successfully!");
                document.getElementById('payoutForm').reset();
            } catch(e) { alert("Error connecting to Cloudflare Worker."); }
        }
    </script>
</body>
</html>
