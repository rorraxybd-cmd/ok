<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiliate Payout - rorraxy Ecosystem</title>
    
    <script src="/ecosystem-core.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --bg-retail: #000000; --card-retail: #08080c; --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%); --gold-solid: #d4af37; --text-white: #ffffff; --text-gray: #a0a0ab; --font-main: 'Poppins', sans-serif; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-retail); color: var(--text-white); font-family: var(--font-main); padding: 24px 16px 110px 16px; text-transform: uppercase; }
        .main-container { width: 100%; max-width: 900px; margin: 0 auto; }
        .dashboard-header { text-align: center; margin-bottom: 25px; }
        .dashboard-header h1 { font-size: 1.5rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .balance-banner, .payout-card { background: var(--card-retail); border-radius: 18px; padding: 24px 20px; margin-bottom: 25px; border: 1px solid rgba(212,175,55,0.15); text-align: center; }
        .balance-banner .amount { font-size: 2.2rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .form-control, .form-select { width: 100%; background: #040407; border: none; border-radius: 12px; padding: 12px 16px; color: var(--text-white); font-size: 0.8rem; text-transform: none; margin-bottom: 15px; }
        .withdraw-btn { width: 100%; background: var(--gold-gradient); border: none; border-radius: 14px; padding: 14px; color: #000; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .affiliate-bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(3, 3, 5, 0.95); border-top: 1px solid rgba(212, 175, 55, 0.15); display: flex; justify-content: space-around; align-items: center; padding: 12px 6px; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; flex: 1; background: none; border: none; }
        .nav-item i, .nav-item span { color: var(--text-gray); font-size: 0.62rem; }
    </style>
</head>
<body>
    <div class="main-container">
        <header class="dashboard-header"><h1>AFFILIATE PAYOUT</h1></header>
        <section class="balance-banner">
            <h3>AVAILABLE WITHDRAWABLE BALANCE</h3>
            <div class="amount">$450.00</div>
        </section>
        <section class="payout-card">
            <form id="payoutForm" onsubmit="requestPayout(event)">
                <input type="number" class="form-control" id="withdrawAmount" placeholder="Enter amount (Min. $20)..." min="20" required>
                <select class="form-select" id="paymentMethod" required>
                    <option value="bKash">bKash</option>
                    <option value="Nagad">Nagad</option>
                    <option value="Bank">Bank Transfer</option>
                </select>
                <input type="text" class="form-control" placeholder="Account Number / Details..." required>
                <button type="submit" class="withdraw-btn">SUBMIT WITHDRAWAL REQUEST</button>
            </form>
        </section>
    </div>

    <nav class="affiliate-bottom-nav">
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i><span>DASHBOARD</span></a>
        <a href="payout.html" class="nav-item active"><i class="fa-solid fa-hand-holding-dollar"></i><span>PAYOUT</span></a>
        <a href="report.html" class="nav-item"><i class="fa-solid fa-chart-column"></i><span>REPORT</span></a>
        <a href="info.html" class="nav-item"><i class="fa-solid fa-user"></i><span>INFO</span></a>
    </nav>

    <script>
        function requestPayout(e) {
            e.preventDefault();
            alert('WITHDRAWAL REQUEST SUBMITTED SUCCESSFULLY!');
            e.target.reset();
        }
    </script>
</body>
</html>
