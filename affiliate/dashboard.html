<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Affiliate Dashboard - rorraxy</title>
   
    <!-- সেন্ট্রাল স্ক্রিপ্ট ট্যাগ -->
    <script src="/ecosystem-core.js"></script>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #08080c;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #a0a0ab;
            --font-main: 'Poppins', sans-serif;
            --border-color: rgba(212, 175, 55, 0.18);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; overflow-x: hidden; background: var(--bg-retail) !important; color: var(--text-white); font-family: var(--font-main); min-height: 100vh; font-size: 14px; -webkit-font-smoothing: antialiased; }
        body { padding: 24px 16px 110px 16px; text-transform: uppercase; }
        
        .main-container { 
            width: 100%; 
            max-width: 1200px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* Header Section */
        .dashboard-header { text-align: center; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
        .header-logo-img { width: 90px; height: 90px; object-fit: contain; background: transparent !important; filter: none !important; box-shadow: none !important; }
        .dashboard-header h1 { font-size: 1.75rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.8px; }

        .header-email-box { display: inline-flex; align-items: center; gap: 8px; background: var(--card-retail); padding: 8px 18px; border-radius: 25px; text-decoration: none; font-size: 0.78rem; color: var(--text-gray); border: 1px solid var(--border-color); text-transform: lowercase; box-shadow: none !important; }
        .header-email-box i { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-email-box span { color: var(--text-white); font-weight: 600; }

        /* Stats Grid Section */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 16px; 
            margin-bottom: 30px; 
            width: 100%; 
        }

        .stat-card { 
            background: var(--card-retail); 
            border-radius: 16px; 
            padding: 20px 14px 14px 14px; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            gap: 8px; 
            border: 1px solid var(--border-color); 
            width: 100%;
            min-width: 0;
            box-shadow: none !important;
        }

        .stat-card h3 { font-size: 0.72rem; color: var(--text-gray); font-weight: 600; letter-spacing: 0.5px; white-space: nowrap; }
        .stat-card .value { font-size: 1.35rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
        
        .graph-container { 
            width: 100%; 
            height: 80px; 
            position: relative; 
            display: block; 
        }
        .graph-container canvas { 
            width: 100% !important; 
            height: 100% !important; 
        }

        /* Bottom Fixed Navigation Menu */
        .seller-bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(3, 3, 5, 0.98); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; padding: 12px 6px; z-index: 1000; box-shadow: none !important; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; flex: 1; background: none; border: none; cursor: pointer; }
        .nav-item.active i, .nav-item.active span { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-item i { font-size: 1.25rem; margin-bottom: 4px; color: var(--text-gray); }
        .nav-item span { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.5px; color: var(--text-gray); }

        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
        }

        @media (max-width: 600px) {
            body { padding: 16px 12px 100px 12px; }
            .stats-grid { grid-template-columns: 1fr; gap: 12px; }
        }
    </style>
</head>
<body>

    <div class="main-container" id="mainContainer">
        <!-- Header -->
        <header class="dashboard-header">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="rorraxy Logo" class="header-logo-img">
            <h1>AFFILIATE DASHBOARD</h1>
            <a href="mailto:affiliate@rorraxy.com?subject=Affiliate%20Support%20Query" class="header-email-box">
                <i class="fa-solid fa-envelope"></i>
                <span id="headerUserEmail">affiliate@rorraxy.com</span>
            </a>
        </header>

        <!-- Stats Overview with Graphs -->
        <section class="stats-grid">
            <div class="stat-card">
                <h3>TOTAL EARNINGS</h3>
                <div class="value" id="statEarningsVal">$0.00</div>
                <div class="graph-container"><canvas id="chartEarnings"></canvas></div>
            </div>
            <div class="stat-card">
                <h3>AVAILABLE BALANCE</h3>
                <div class="value" id="statBalanceVal">$0.00</div>
                <div class="graph-container"><canvas id="chartBalance"></canvas></div>
            </div>
            <div class="stat-card">
                <h3>TOTAL CLICKS</h3>
                <div class="value" id="statClicksVal">0</div>
                <div class="graph-container"><canvas id="chartClicks"></canvas></div>
            </div>
            <div class="stat-card">
                <h3>TOTAL REFERRALS</h3>
                <div class="value" id="statReferralsVal">0</div>
                <div class="graph-container"><canvas id="chartReferrals"></canvas></div>
            </div>
        </section>
    </div>

    <!-- Affiliate Bottom Navigation Menu -->
    <nav class="seller-bottom-nav">
        <a href="dashboard.html" class="nav-item active">
            <i class="fa-solid fa-chart-line"></i>
            <span>OVERVIEW</span>
        </a>
        <a href="links.html" class="nav-item">
            <i class="fa-solid fa-link"></i>
            <span>LINKS</span>
        </a>
        <a href="payout.html" class="nav-item">
            <i class="fa-solid fa-wallet"></i>
            <span>PAYOUT</span>
        </a>
        <a href="reports.html" class="nav-item">
            <i class="fa-solid fa-file-invoice-dollar"></i>
            <span>REPORTS</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i class="fa-solid fa-user-gear"></i>
            <span>SETTINGS</span>
        </a>
    </nav>

    <!-- Firebase Auth & Affiliate Stats Script -->
    <script type="module">
        import { auth } from './firebase.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const headerUserEmail = document.getElementById('headerUserEmail');

        // অথেনটিকেশন চেক
        onAuthStateChanged(auth, (user) => {
            if (user) {
                headerUserEmail.innerText = user.email;
                loadAffiliateStats();
            } else {
                window.location.href = 'index.html';
            }
        });

        // অ্যাফিলিয়েট ডেটা ফেচিং (ডেমো/ক্লাউডফ্লেয়ার সিঙ্ক)
        async function loadAffiliateStats() {
            try {
                // আপনি এখানে আপনার ক্লাউডফ্লেয়ার API বা ফায়ারবেস থেকে অ্যাফিলিয়েট ডেটা লোড করতে পারেন
                document.getElementById('statEarningsVal').innerText = "$125.50";
                document.getElementById('statBalanceVal').innerText = "$95.00";
                document.getElementById('statClicksVal').innerText = "1,420";
                document.getElementById('statReferralsVal').innerText = "38";
            } catch (e) {
                console.error("Affiliate Data Sync Error:", e);
            }
        }

        // গ্রাফ রেন্ডারিং ফাংশন
        function createDynamicSparkline(canvasId, dataPoints, isBar = false) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createLinearGradient(0, 0, 0, 80);
            gradient.addColorStop(0, 'rgba(252, 246, 186, 0.5)');
            gradient.addColorStop(0.6, 'rgba(179, 135, 40, 0.15)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            return new Chart(ctx, {
                type: isBar ? 'bar' : 'line',
                data: {
                    labels: dataPoints.map((_, i) => `Point ${i + 1}`),
                    datasets: [{
                        data: dataPoints,
                        borderColor: '#fcf6ba',
                        borderWidth: 2,
                        fill: true,
                        backgroundColor: gradient,
                        tension: 0.4,
                        pointRadius: 0,
                        borderRadius: isBar ? 4 : 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 1200, easing: 'easeOutQuart' },
                    plugins: { 
                        legend: { display: false }, 
                        tooltip: { enabled: false } 
                    },
                    scales: { 
                        x: { display: false }, 
                        y: { display: false, min: 0 } 
                    }
                }
            });
        }

        // DOM লোড হওয়ার পর চার্ট জেনারেট
        window.addEventListener('load', () => {
            setTimeout(() => {
                createDynamicSparkline('chartEarnings', [10, 20, 35, 40, 60, 85, 120]);
                createDynamicSparkline('chartBalance', [5, 15, 25, 30, 45, 60, 95]);
                createDynamicSparkline('chartClicks', [100, 250, 400, 600, 850, 1100, 1420], true);
                createDynamicSparkline('chartReferrals', [2, 5, 10, 18, 25, 30, 38]);
            }, 100);
        });
    </script>
</body>
</html>
