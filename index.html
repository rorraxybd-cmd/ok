<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>rorraxy - Multi-Mode E-Commerce Platform</title>
    
    <!-- Central Script Tag -->
    <script src="/ecosystem-core.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://img.rorraxy.com">

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://img.rorraxy.com/rorraxyfree/mr%20masudar%20logo%20(3).png">
    <link rel="apple-touch-icon" href="https://img.rorraxy.com/rorraxyfree/mr%20masudar%20logo%20(3).png">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #0a0a0f;
            --header-retail: rgba(0, 0, 0, 0.85);
            --footer-retail: rgba(4, 4, 6, 0.95);
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-solid: #d4af37;
            --pink-love: #ff2a85;
            --text-white: #ffffff;
            --text-gray: #a0a0b5;
            --font-main: 'Poppins', sans-serif;
        }

        html, body { 
            width: 100%; max-width: 100%; overflow-x: hidden; 
            background: var(--bg-retail) !important; 
            color: var(--text-white); font-family: var(--font-main); 
            min-height: 100vh; font-size: 15px;
            -webkit-font-smoothing: antialiased;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        
        body { padding-top: 38px; padding-bottom: 75px; text-transform: uppercase !important; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        header.app-header {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: var(--header-retail); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex; flex-direction: row; align-items: center; justify-content: space-between;
            border: none !important; box-shadow: none !important;
            transform: translateZ(0); padding-right: 8px;
        }

        .trending-marquee-bar {
            overflow: hidden; white-space: nowrap; font-size: 0.70rem; font-weight: 500; text-transform: uppercase;
            flex: 1; display: flex; align-items: center; height: 38px; position: relative; background: #040406;
            border: none !important;
            transform: translateZ(0);
        }
        
        .marquee-container { 
            display: flex; width: max-content; 
            animation: smoothMarquee 35s linear infinite; 
            will-change: transform; 
            backface-visibility: hidden;
        }

        .marquee-group { display: flex; align-items: center; gap: 35px; padding-right: 35px; flex-shrink: 0; }
        .marquee-group span { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-gray); }
        .txt-gold { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        @keyframes smoothMarquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        /* Mode Selector Top Right Dropdown Box */
        .mode-selector-corner {
            background: #0d0d14;
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #d4af37;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            height: 28px;
            z-index: 1001;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
        }
        .mode-selector-corner option {
            background: #0a0a0f;
            color: #ffffff;
            font-weight: 500;
            padding: 6px;
        }

        /* Luxury Modal Overlay */
        .luxury-center-modal-overlay {
            display: none; position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important;
            background: rgba(0, 0, 0, 0.85) !important; z-index: 99999 !important; backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
        }
        .luxury-center-modal-box {
            background: #0d0d12; width: 100%; max-width: 450px; border-radius: 24px; 
            padding: 28px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; 
            position: relative; border: 1px solid rgba(212,175,55,0.2); max-height: 90vh; overflow-y: auto;
            scrollbar-width: thin; scrollbar-color: var(--gold-solid) transparent;
            -webkit-overflow-scrolling: touch;
        }
        .luxury-modal-close-btn { 
            position: absolute; top: 16px; right: 16px;
            background: rgba(212,175,55,0.08); border: 1px solid rgba(212,175,55,0.2); color: var(--gold-solid); 
            font-size: 1rem; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; transition: 0.2s; z-index: 10;
        }
        .luxury-modal-close-btn:hover { background: rgba(212,175,55,0.2); }

        .luxury-modal-logo-large { width: 75px; height: 75px; object-fit: contain; margin-bottom: 12px; cursor: pointer; }
        
        .modal-material-info-text {
            font-size: 0.68rem; font-weight: 600; color: var(--text-gray) !important; text-align: center;
            margin-bottom: 12px; line-height: 1.4; text-transform: uppercase; letter-spacing: 2px;
            padding: 0 10px; display: block !important;
        }

        .modal-marquee-wrapper {
            width: 100%; overflow: hidden; white-space: nowrap; margin-bottom: 18px;
            background: rgba(255, 255, 255, 0.03); padding: 8px 0; border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.1); display: block !important;
        }
        .modal-marquee-container {
            display: flex; width: max-content;
            animation: smoothMarquee 30s linear infinite; 
        }
        .modal-marquee-group {
            display: flex; align-items: center; gap: 20px; padding-right: 20px; font-size: 0.68rem; font-weight: 500; color: var(--text-gray);
        }

        .luxury-modal-title-top {
            font-size: 1rem; font-weight: 600; background: var(--gold-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px;
            margin-bottom: 16px; text-transform: uppercase; cursor: pointer;
        }
        .luxury-options-fullstack { display: flex; flex-direction: column; gap: 10px; width: 100%; align-items: center; }
        .luxury-action-btn-item {
            background: #121218; color: var(--text-white); padding: 14px 18px; border-radius: 14px; text-decoration: none; 
            display: flex; align-items: center; justify-content: space-between;
            border: 1px solid rgba(212,175,55,0.12); transition: background 0.2s; width: 100%; cursor: pointer;
        }
        .luxury-action-btn-item:hover {
            border-color: rgba(212,175,55,0.4);
            background: #181822;
        }
        .luxury-action-btn-item .btn-left-part { display: flex; align-items: center; gap: 12px; }
        .luxury-action-btn-item i { font-size: 1.1rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; width: 22px; text-align: center; }
        .btn-text-stack { display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
        .btn-main-title { font-size: 0.82rem; font-weight: 500; color: var(--text-white); text-transform: uppercase; line-height: 1.2; }
        .explore-subtxt { font-size: 0.60rem; font-weight: 400; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
        .btn-right-arrow { font-size: 0.75rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Feed Container Layout - Pinterest Style Grid */
        .feed-container {
            padding: 8px 6px; 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 8px; 
            width: 100%; 
            max-width: 1400px; 
            margin: 0 auto;
        }
        @media (min-width: 768px) { 
            .feed-container { 
                grid-template-columns: repeat(4, 1fr); 
                gap: 14px; 
                padding: 12px; 
            } 
        }

        .product-card {
            background: var(--card-retail); 
            border-radius: 14px; overflow: hidden; 
            display: flex; flex-direction: column; width: 100%; 
            border: 1px solid rgba(212,175,55,0.12); position: relative;
            cursor: pointer;
            break-inside: avoid;
            margin-bottom: 8px;
        }
        .product-card:hover { border-color: rgba(212,175,55,0.35); }

        .product-media-box { position: relative; width: 100%; background: #050508; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .product-media-box img { width: 100%; height: auto; display: block; object-fit: cover; background: #050508; }
        
        .product-country-discount-badge {
            position: absolute; top: 8px; left: 8px; z-index: 10;
            background: rgba(255, 42, 133, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 3px 8px; border-radius: 8px; display: flex; align-items: center; gap: 5px;
            font-size: 0.58rem; font-weight: 700; color: #ffffff !important;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .product-country-discount-badge img.flag-icon {
            width: 13px; height: 9px; object-fit: cover; border-radius: 2px; display: inline-block;
        }

        .card-footer-actions { 
            display: flex; justify-content: space-between; align-items: center; padding: 10px; 
            background: #06060a !important; border-top: 1px solid rgba(255,255,255,0.05); gap: 4px; 
            margin-top: auto;
        }
        .product-price-tag { font-size: 0.85rem; font-weight: 600; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .card-sub-actions { display: flex; align-items: center; gap: 12px; justify-content: center; }
        
        .love-action { display: flex; align-items: center; gap: 4px; cursor: pointer; font-size: 0.70rem; font-weight: 500; color: var(--text-gray) !important; transition: 0.15s; }
        .love-action:hover { color: var(--text-white) !important; }
        .love-action i { color: var(--pink-love); }
        .love-action.gold-active { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 600; }
        .love-action.gold-active i { background: var(--gold-gradient) !important; -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; }
        
        .share-action-btn { background: none; border: none; font-size: 0.70rem; font-weight: 500; cursor: pointer; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; display: flex; align-items: center; gap: 4px; }

        /* Clean Fixed Bottom Navigation Bar */
        nav.bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--footer-retail);
            display: flex; justify-content: space-around; align-items: center; padding: 8px 4px 10px 4px;
            z-index: 1000; backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: none !important; border-top: none !important; box-shadow: none !important;
            transform: translateZ(0);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; text-decoration: none;
            font-size: 0.50rem; font-weight: 600; cursor: pointer; text-align: center; gap: 3px; flex: 1; position: relative;
            text-transform: uppercase; background: none; border: none;
        }
        
        .nav-item i { 
            font-size: 1.25rem; 
            background: var(--gold-gradient);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            line-height: 1;
        }
        
        .nav-item span {
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
            font-size: 0.50rem;
            letter-spacing: 0.5px;
            line-height: 1;
            font-weight: 600;
        }

        .cart-icon-box { position: relative; display: inline-flex; align-items: center; justify-content: center; }
        
        .cart-badge-circle {
            position: absolute; top: -5px; right: -8px; 
            background: var(--pink-love); color: #ffffff !important;
            font-size: 0.50rem; font-weight: 700; width: 15px; height: 15px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; 
            z-index: 5;
        }
        .cart-badge-circle.empty-badge { display: none !important; }
        .cart-custom-svg { width: 22px; height: 22px; fill: url(#goldGradientSvg); }
    </style>
</head>
<body id="mainBody">

        <stop offset="25%" stop-color="#fcf6ba" />
        <stop offset="50%" stop-color="#b38728" />
        <stop offset="75%" stop-color="#fbf5b7" />
        <stop offset="100%" stop-color="#aa771c" />

    </svg>

    <!-- Header Section -->
    <header class="app-header" id="mainHeader">

            <div class="marquee-container" id="marqueeContainer1">
                <div class="marquee-group">

                    <span class="txt-gold"><i class="fa-solid fa-gem"></i> Baby Fashion</span>
                    <span class="txt-gold"><i class="fa-solid fa-star"></i> Girls Fashion</span>
                    <span class="txt-gold"><i class="fa-solid fa-fire"></i> Boy Fashion</span>
                    <span class="txt-gold"><i class="fa-solid fa-bolt"></i> Men Fashion</span>

                            <span class="btn-main-title">My Account</span>
                            <span class="explore-subtxt">Dashboard</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-right btn-right-arrow"></i>

                <div class="luxury-action-btn-item" onclick="navigateTo('/seller/index.html')">

                        <div class="btn-text-stack">

                    <i class="fa-solid fa-arrow-right btn-right-arrow"></i>

        </div>
    </div>

    <!-- Main Feed Container loaded dynamically from Cloudflare D1 database -->
    <main class="feed-container" id="productFeed">
        <!-- Loading Spinner Placeholder -->
        <div style="grid-column: 1 / -1; text-align: center; padding: 50px 0; color: var(--gold-solid);">
            <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
            <p style="margin-top: 10px; font-size: 0.75rem; letter-spacing: 1px;">LOADING rorraxy PRODUCTS...</p>
        </div>

    <!-- Optimized Bottom Navigation Bar -->
    <nav class="bottom-nav" id="bottomNav">
        <a href="/world.html" class="nav-item">
            <i class="fa-solid fa-earth-americas"></i>

        </a>
        <div class="nav-item" id="youNavBtn" onclick="openYouMenuModal(event)">
            <i class="fa-solid fa-user"></i>
            <span>You</span>
        </div>
        <a href="/video.html" class="nav-item">
            <i class="fa-brands fa-youtube"></i>
            <span>Video</span>

            <span>Category</span>
        </a>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            initSelectedMode();
            updateCartBadgeCount();
            loadLiveProducts();

            const modals = document.querySelectorAll('.luxury-center-modal-overlay');
            modals.forEach(modal => {
                modal.onclick = function(event) {
                    if (event.target === modal) {
                        closeAllModals();
                    }
                };
            });

            setInterval(() => {
                updateCartBadgeCount();
            }, 1000);
        });

        function initSelectedMode() {
            const currentMode = localStorage.getItem('rorraxy_mode') || 'retail';
            const selector = document.getElementById('userModeSelector');
            if (selector) {
                selector.value = currentMode;
            }
        }

        function switchEcosystemMode(selectedMode) {
            localStorage.setItem('rorraxy_mode', selectedMode);
            loadLiveProducts();
        }

        // ক্লাউডফ্লেয়ার পেজেস এপিআই `/api/products` থেকে সরাসরি ফেচ করা
        async function loadLiveProducts() {
            const currentMode = localStorage.getItem('rorraxy_mode') || 'retail';
            try {
                const response = await fetch(`/api/products?mode=${currentMode}`);
                const result = await response.json();
                if (result.success && Array.isArray(result.data) && result.data.length > 0) {
                    renderProductCards(result.data);
                } else {
                    renderFallbackProducts();
                }
            } catch (error) {
                console.error('Failed to load products from Cloudflare backend:', error);
                renderFallbackProducts();
            }
        }

        // রিয়েল ইমেজ ও প্রোডাক্ট কার্ড রেন্ডারার (কাস্টম ডোমেইন img.rorraxy.com সহ)
        function renderProductCards(products) {
            const feedContainer = document.getElementById('productFeed');
            feedContainer.innerHTML = '';

            products.forEach(item => {
                const productId = item.id || item.product_id || item.product_code || '101';
                const title = item.title || 'rorraxy Luxury Item';
                const price = item.price ? `$${parseFloat(item.price).toFixed(2)}` : '$0.00';
                const discount = item.discount_rate || item.discountRate || '50';
                const countryCode = (item.target_country || item.targetCountry || 'bd').toLowerCase();
                const flagUrl = `https://flagcdn.com/w20/${countryCode}.png`;
                
                let resolvedImageUrl = 'https://img.rorraxy.com/rorraxyfree/mr%20masudar%20logo%20(3).png';
                if (item.image_url) {
                    resolvedImageUrl = item.image_url;
                } else if (item.imageUrl) {
                    resolvedImageUrl = item.imageUrl;
                } else if (item.images_json) {
                    try {
                        const parsedImages = JSON.parse(item.images_json);
                        if (Array.isArray(parsedImages) && parsedImages.length > 0) {
                            resolvedImageUrl = parsedImages[0];
                        }
                    } catch (e) {
                        if (typeof item.images_json === 'string' && item.images_json.trim() !== '') {
                            resolvedImageUrl = item.images_json.split(',')[0].trim();
                        }
                    }
                }

                // পুরনো r2.dev লিংক থাকলে নতুন কাস্টম ডোমেইন img.rorraxy.com দিয়ে রিপ্লেস করা
                if (resolvedImageUrl.includes('.r2.dev')) {
                    resolvedImageUrl = resolvedImageUrl.replace(/https:\/\/[^/]+\.r2\.dev/, 'https://img.rorraxy.com');
                }

                const cardHtml = `
                    <div class="product-card" data-product-id="${productId}" onclick="openProductDetails('${productId}')">
                        <div class="product-media-box">
                            <div class="product-country-discount-badge">
                                <img src="${flagUrl}" alt="${countryCode}" class="flag-icon" onerror="this.style.display='none'"> ${discount}% OFF
                            </div>
                            <img src="${resolvedImageUrl}" alt="${title}" loading="lazy" onerror="this.src='https://img.rorraxy.com/rorraxyfree/mr%20masudar%20logo%20(3).png'">
                        </div>
                        <div class="card-footer-actions" onclick="event.stopPropagation()">
                            <span class="product-price-tag">${price}</span>
                            <div class="card-sub-actions">
                                <div class="love-action card-love-btn" onclick="toggleLove(event, this)">
                                    <i class="fa-solid fa-heart"></i> <span class="love-count">${item.like_count || 128}</span>
                                </div>
                                <button class="share-action-btn" onclick="triggerAutoShare(event, '${productId}', '${title.replace(/'/g, "\\'")}')">
                                    <i class="fa-solid fa-share-nodes"></i> Share
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                feedContainer.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        function renderFallbackProducts() {
            const feedContainer = document.getElementById('productFeed');
            feedContainer.innerHTML = `
                <div class="product-card" data-product-id="101" onclick="openProductDetails('101')">
                    <div class="product-media-box">
                        <div class="product-country-discount-badge">
                            <img src="https://flagcdn.com/w20/bd.png" alt="BD" class="flag-icon"> 50% OFF
                        </div>
                        <img src="https://img.rorraxy.com/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="Demo Item" loading="lazy">
                    </div>
                    <div class="card-footer-actions" onclick="event.stopPropagation()">
                        <span class="product-price-tag">$35.00</span>
                        <div class="card-sub-actions">
                            <div class="love-action card-love-btn" onclick="toggleLove(event, this)">
                                <i class="fa-solid fa-heart"></i> <span class="love-count">128</span>
                            </div>
                            <button class="share-action-btn" onclick="triggerAutoShare(event, '101', 'Demo Item')">
                                <i class="fa-solid fa-share-nodes"></i> Share
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function openProductDetails(productId) {
            window.location.href = `pd.html?id=${productId}`;
        }

        function navigateTo(url) {
            window.location.href = url;
        }

        function openYouMenuModal(event) {
            if(event) event.stopPropagation();
            closeAllModals();
            const modal = document.getElementById('youMenuModalOverlay');
            if(modal) modal.style.display = 'flex';
        }

        function closeYouMenuModal() {
            const modal = document.getElementById('youMenuModalOverlay');
            if(modal) modal.style.display = 'none';
        }

        function closeAllModals() {
            document.querySelectorAll('.luxury-center-modal-overlay').forEach(m => m.style.display = 'none');
        }

        async function toggleLove(event, btn) {
            event.stopPropagation();
            let card = btn.closest('.product-card');
            let productId = card.getAttribute('data-product-id');
            let countSpan = btn.querySelector('.love-count');
            let currentLikes = parseInt(countSpan.innerText);

            if(btn.classList.contains('gold-active')) {
                btn.classList.remove('gold-active');
                countSpan.innerText = currentLikes - 1;
            } else {
                btn.classList.add('gold-active');
                countSpan.innerText = currentLikes + 1;
                
                try {
                    await fetch(`/api/products`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ product_code: productId })
                    });
                } catch (err) {
                    console.error('Failed to update like count:', err);
                }
            }
        }

        async function triggerAutoShare(event, productId, productTitle) {
            event.stopPropagation();
            const shareUrl = `${window.location.origin}/pd.html?id=${productId}`;
            const shareData = {
                title: `${productTitle} - rorraxy`,
                text: `Check out this product on rorraxy: ${productTitle}`,
                url: shareUrl
            };

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {}
            } else if (navigator.clipboard) {
                try {
                    await navigator.clipboard.writeText(shareUrl);
                    const shareBtn = event.currentTarget;
                    const origText = shareBtn.innerHTML;
                    shareBtn.innerHTML = `<i class="fa-solid fa-check"></i> COPIED!`;
                    setTimeout(() => { shareBtn.innerHTML = origText; }, 1500);
                } catch (err) {}
            }
        }

        function updateCartBadgeCount() {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            let totalQty = cart.reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);
            
            let badge = document.getElementById('floatingCartItemCountBadge');
            if(badge) {
                badge.innerText = totalQty;
                if(totalQty > 0) {
                    badge.classList.remove('empty-badge');
                } else {
                    badge.classList.add('empty-badge');
                }
            }
        }
    </script>
</body>
</html>
